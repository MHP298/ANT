<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta http-equiv="Pragma" content="no-cache">

  <style>
    #landscape-warning { display: none; }
    @media screen and (orientation: portrait) and (max-width: 1024px) {
      #landscape-warning { display: flex !important; }
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
    
    /* VÙNG CHỌN MÀU XANH ADMIN CHÍNH GIỮA KHUNG ĐẤT */
    .admin-plot-box {
      position: absolute;
      border: 3.5px dashed #10b981;
      background-color: rgba(16, 185, 129, 0.28);
      touch-action: none;
      cursor: move;
      z-index: 40;
      box-sizing: border-box;
      pointer-events: auto !important;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.35);
    }
    .admin-plot-box.locked {
      cursor: not-allowed;
      border-color: #64748b;
      background-color: rgba(100, 116, 139, 0.25);
      box-shadow: none;
    }

    /* 4 ĐIỂM NEO Ở 4 GÓC ĐIỀU CHỈNH HÌNH DÁNG, KÍCH THƯỚC */
    .corner-node {
      position: absolute;
      width: 22px;
      height: 22px;
      background-color: #047857;
      border: 3px solid #ffffff;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      z-index: 60;
      pointer-events: auto !important;
      transition: transform 0.15s;
    }
    .corner-node:hover { transform: scale(1.3); background-color: #059669; }
    .node-tl { top: -11px; left: -11px; cursor: nwse-resize; }
    .node-tr { top: -11px; right: -11px; cursor: nesw-resize; }
    .node-bl { bottom: -11px; left: -11px; cursor: nesw-resize; }
    .node-br { bottom: -11px; right: -11px; cursor: nwse-resize; }

    .btn-cat-active {
      background-color: #047857 !important;
      color: #ffffff !important;
      border-color: #34d399 !important;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.25);
    }
    .garden-placed-flower {
      position: absolute;
      touch-action: none;
      user-select: none;
      cursor: grab;
      z-index: 25;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body id="game-wrapper" class="bg-cover bg-center h-screen w-screen overflow-hidden flex flex-col font-sans select-none" style="background-image: url('assets/nengame/nenungdung.jpg');">

  <!-- CẢNH BÁO XOAY NGANG -->

    <div class="w-20 h-20 bg-emerald-600/20 text-emerald-400 rounded-3xl flex items-center justify-center text-4xl mb-4 border border-emerald-500/30 animate-pulse">
      <i class="fa-solid fa-mobile-screen-button rotate-90"></i>
    </div>
    <h2 class="text-lg font-black uppercase text-amber-300 mb-2">Vui Lòng Xoay Ngang Thiết Bị</h2>

  <!-- POPUP ĐĂNG NHẬP -->
  <div id="student-login-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">

      <div class="w-16 h-16 bg-emerald-100 text-emerald-700 rounded-2xl flex items-center justify-center mx-auto text-3xl mb-3 shadow-inner">🌸</div>
      <h2 class="text-lg font-black text-slate-800 uppercase">Vườn Thi Đua Lớp Học</h2>
      <p class="text-xs text-slate-500 mb-4">Nhập tài khoản học sinh hoặc tài khoản giáo viên (admin)</p>

        <div>

  <!-- HEADER -->

      <div id="hdr-class-container" class="ml-1 hidden">

      </div>
    </div>
    <div class="flex items-center gap-2.5">
      <button onclick="clearPlacedGardenFlowers()" class="px-2.5 py-1 text-[10px] font-bold rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100 transition"><i class="fa-solid fa-trash-can"></i> Dọn Hoa</button>

  <!-- BỐ CỤC CHÍNH -->

    <!-- PHẦN A: SÂN VƯỜN -->
    <section id="section-a" class="w-3/4 h-full relative bg-slate-950 overflow-hidden flex items-center justify-center border-r-2 border-black/20" ondragover="handleDragOver(event)" ondrop="handleDrop(event)">

      <!-- Bảng tên trường/lớp cố định -->
      <div class="absolute top-2 left-1/2 transform -translate-x-1/2 z-10 pointer-events-none">
        <div class="px-6 py-1.5 bg-amber-100/90 border-2 border-amber-800 rounded-xl shadow-md text-amber-950 font-black text-xs md:text-sm tracking-wider uppercase">

      <!-- LỚP VÙNG CHỌN MÀU XANH ADMIN -->

    <!-- PHẦN B: KHAY CÔNG CỤ -->

          <div class="grid grid-cols-4 gap-1.5" id="dynamic-button-bar"></div>
        </div>
        
        <div class="p-2 flex-1 flex flex-col overflow-y-auto bg-white/5">
          <div class="flex items-center justify-between mb-1.5 shrink-0">
            <span id="category-title" class="text-[10px] font-black uppercase text-emerald-300">KHO VẬT PHẨM</span>
            <span id="category-count" class="text-[9px] text-slate-300"></span>
          </div>
          <div id="tray-grid" class="grid grid-cols-3 gap-1.5"></div>
        </div>
      </div>

      <!-- BẢNG ĐIỀU KHIỂN ADMIN DƯỚI ĐÁY -->
      <div id="admin-bottom-panel" class="p-2.5 bg-slate-900/95 backdrop-blur border-t border-white/20 text-white space-y-2 hidden shrink-0 text-xs">
        <div class="font-black text-[10px] uppercase text-emerald-400 flex items-center justify-between">
          <span><i class="fa-solid fa-gear"></i> BẢNG ĐIỀU KHIỂN ADMIN</span>
          <button onclick="centerPlotToGarden()" class="text-[9px] px-2 py-0.5 bg-emerald-700 hover:bg-emerald-600 rounded text-white font-bold" title="Đặt lại vùng chọn vào đúng giữa khung đất">

        </div>
        <div class="grid grid-cols-2 gap-1.5">
          <input type="text" id="admin-input-classname" placeholder="Tên lớp (VD: 10A1)" class="px-2 py-1 rounded bg-slate-800 border border-slate-700 text-xs font-bold uppercase text-white">
          <input type="number" id="admin-input-size" placeholder="Sĩ số (VD: 45)" class="px-2 py-1 rounded bg-slate-800 border border-slate-700 text-xs font-bold text-white">
        </div>
        <div class="grid grid-cols-2 gap-1.5">
          <button onclick="saveAdminClassConfiguration()" class="col-span-2 py-1.5 px-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded text-[11px] transition shadow">
            Lưu Cấu Hình Lên Firebase
          </button>
        </div>
      </div>

  <script>
    // CẤU HÌNH GITHUB REPOSITORY ĐƯỢC LẤY CHUẨN XÁC TỪ ẢNH CÂY THƯ MỤC CỦA BẠN
    const GITHUB_REPO_INFO = {
      owner: 'MHP298',
      repo: 'ANT',
      branch: 'main',
      basePath: 'Games/vuonthidua/assets'
    };

    const firebaseConfig = {
      apiKey: "AIzaSyBWcjpJ-rEg1T7DPsEdxe76NtEn5keWKQU",
      authDomain: "gametronghoa-29c3d.firebaseapp.com",
      projectId: "gametronghoa-29c3d",
      storageBucket: "gametronghoa-29c3d.firebasestorage.app",
      messagingSenderId: "711706191185",
      appId: "1:711706191185:web:63f7dd4dbbea7184f29f70",
      measurementId: "G-G45LESKLYW"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const BUTTON_CATEGORIES = [
      { key: 'nutnu.png', label: 'NỤ', folder: 'nucap1' },
      { key: 'nuthoa.png', label: 'HOA', folder: 'hoacap1' },
      { key: 'nutchunhat.png', label: 'ĐẤT', folder: 'nendat' },
      { key: 'nutxeng.png', label: 'CÔNG CỤ', folder: 'congcu' }
    ];

    let currentActiveButtonKey = 'nutnu.png';
    let activeClassName = '10A1';
    let selectedPlotId = 'slot_1';

    // BỘ NHỚ ĐỆM ẢNH QUÉT TỪ GITHUB REPO
    const repoImageCache = {};

    // VÙNG CHỌN BAN ĐẦU CHÍNH GIỮA KHUNG ĐẤT
    let currentClass = {
      name: '10A1',
      config: {
        bgA: 'assets/nengame/vuonlop.jpg',
        plotSlots: [
          { id: 'slot_1', name: 'Khu đất 1', teamId: 1, left: 24, top: 32, width: 50, height: 46, locked: false, soilImage: null }
        ]
      },
      students: {},
      weeklyRanking: { 1: 1, 2: 2, 3: 3, 4: 4 },
      checkedInStudents: [],
      placedFlowers: []
    };

    let currentStudent = null;
    let draggedItemData = null;
    let unsubscribeFirestore = null;

    function togglePasswordVisibility(inputId, iconId) {
      const inputEl = document.getElementById(inputId);
      const iconEl = document.getElementById(iconId);
      if (inputEl.type === 'password') {
        inputEl.type = 'text';
        iconEl.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        inputEl.type = 'password';
        iconEl.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    async function handleStudentLogin() {
      const user = document.getElementById('input-student-user').value.trim();
      const pass = document.getElementById('input-student-pass').value.trim();
      const err = document.getElementById('login-error-msg');

      if (!user) { err.innerText = 'Vui lòng nhập tài khoản!'; err.classList.remove('hidden'); return; }

      if (user === 'admin') {
        if (pass !== 'admjn1234') { err.innerText = 'Sai mật khẩu giáo viên!'; err.classList.remove('hidden'); return; }
        currentStudent = { username: 'admin', name: 'Giáo Viên (Admin)', role: 'TEACHER', team: 0 };
        document.getElementById('student-login-modal').classList.add('hidden');
        document.getElementById('admin-bottom-panel').classList.remove('hidden');
        
        activeClassName = '10A1';
        listenClassFromFirebase(activeClassName, () => { applyClassConfiguration(); });
        return;
      }

      let matchedClass = user.split('_')[0].toUpperCase();
      const docRef = db.collection('classes').doc(matchedClass);
      const docSnap = await docRef.get();

      if (!docSnap.exists) {
        err.innerText = 'Không tìm thấy lớp học trên Firebase!'; err.classList.remove('hidden'); return;
      }

      const classData = docSnap.data();
      const studentObj = classData.students ? classData.students[user] : null;

      if (!studentObj || (studentObj.password && studentObj.password !== pass)) {
        err.innerText = 'Tài khoản hoặc mật khẩu không chính xác!'; err.classList.remove('hidden'); return;
      }

      currentStudent = studentObj;
      activeClassName = matchedClass;
      document.getElementById('student-login-modal').classList.add('hidden');
      listenClassFromFirebase(activeClassName, () => { applyClassConfiguration(); });
    }

    function listenClassFromFirebase(className, callback) {
      if (unsubscribeFirestore) unsubscribeFirestore();
      unsubscribeFirestore = db.collection('classes').doc(className).onSnapshot((doc) => {
        if (doc.exists) {
          const remoteData = doc.data();
          if (!remoteData.config || !remoteData.config.plotSlots || remoteData.config.plotSlots.length === 0) {
            remoteData.config = remoteData.config || {};
            remoteData.config.plotSlots = [
              { id: 'slot_1', name: 'Khu đất 1', teamId: 1, left: 24, top: 32, width: 50, height: 46, locked: false, soilImage: null }
            ];
          } else {
            // Tự động kiểm tra vị trí an toàn, nếu bị lưu kẹt ở góc trên sẽ đưa vào vùng trung tâm
            remoteData.config.plotSlots = remoteData.config.plotSlots.map(slot => {
              if (slot.top < 10 || slot.left < 5) {
                slot.left = 24; slot.top = 32; slot.width = 50; slot.height = 46;
              }
              return slot;
            });
          }
          currentClass = remoteData;
          applyClassConfiguration();
        } else {
          saveClassToFirebase();
        }
        if (callback) { callback(); callback = null; }
      });
    }

    function saveClassToFirebase() {
      if (!activeClassName) return;
      db.collection('classes').doc(activeClassName).set(currentClass).catch(err => console.error(err));
    }

    function centerPlotToGarden() {
      currentClass.config.plotSlots = [
        { id: 'slot_1', name: 'Khu đất 1', teamId: 1, left: 24, top: 32, width: 50, height: 46, locked: false, soilImage: null }
      ];
      selectedPlotId = 'slot_1';
      renderAdminPlots();
      saveClassToFirebase();
    }

    function saveAdminClassConfiguration() {
      const className = document.getElementById('admin-input-classname').value.trim().toUpperCase();
      const size = parseInt(document.getElementById('admin-input-size').value) || 0;
      if (!className || size <= 0) return alert('Vui lòng nhập tên lớp và sĩ số!');

      activeClassName = className;
      let newStudents = {};
      let csvContent = "STT,TaiKhoan,MatKhau,To\n";
      for (let i = 1; i <= size; i++) {
        let sttStr = i < 10 ? `0${i}` : `${i}`;
        let username = `${className}_stt${sttStr}`;
        let teamNum = ((i - 1) % 4) + 1;
        newStudents[username] = { username, name: `Học sinh ${sttStr}`, stt: sttStr, team: teamNum, class: className, password: 'hs123', role: 'MEMBER' };
        csvContent += `${sttStr},${username},hs123,Tổ ${teamNum}\n`;
      }

      currentClass.name = className;
      currentClass.students = newStudents;

      db.collection('classes').doc(className).set(currentClass).then(() => {
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `dulieudangnhap_${className}.csv`; a.click();
        alert(`Đã lưu cấu hình lớp ${className} lên Firebase!`);
        applyClassConfiguration();
      }).catch(err => alert("Lỗi Firebase: " + err.message));
    }

    function handleStudentLogout() { location.reload(); }

    function checkPermissionOnPlot(targetTeamId) {
      if (!currentStudent) return { allowed: false, msg: 'Chưa đăng nhập!' };
      if (currentStudent.role === 'TEACHER' || currentStudent.username === 'admin') return { allowed: true };
      if (currentStudent.role === `TT${targetTeamId}`) return { allowed: true };
      return { allowed: false, msg: `Chỉ Tổ trưởng Tổ ${targetTeamId} hoặc Admin mới có quyền thao tác khu đất này!` };
    }

    function getPlotAllowedProductsCount(teamId) {
      const rank = currentClass.weeklyRanking ? (currentClass.weeklyRanking[teamId] || 4) : 4;
      if (rank === 1) return 4; if (rank === 2) return 3; if (rank === 3) return 2; return 1;
    }

    function getGrowthScaleMultiplier(teamId) {
      const teamStudents = Object.values(currentClass.students || {}).filter(s => s.team === teamId);
      if (teamStudents.length === 0) return 1.0;
      const checkedInInTeam = teamStudents.filter(s => (currentClass.checkedInStudents || []).includes(s.username)).length;
      return 0.4 + (0.6 * (checkedInInTeam / teamStudents.length));
    }

    function applyClassConfiguration() {
      const classContainer = document.getElementById('hdr-class-container');
      const classBadge = document.getElementById('hdr-class-badge');
      if (currentClass.name) {
        classBadge.innerText = `Lớp ${currentClass.name}`;
        classContainer.classList.remove('hidden');
        const inputClassEl = document.getElementById('admin-input-classname');
        if (inputClassEl && !inputClassEl.value) inputClassEl.value = currentClass.name;
      }
      if (currentStudent) {
        document.getElementById('hdr-student-name').innerText = `${currentStudent.name} ${currentStudent.team ? '(Tổ ' + currentStudent.team + ')' : ''}`;
      }
      renderAdminPlots();
      renderDynamicButtons();
      switchButtonCategory(currentActiveButtonKey);
      restorePlacedFlowers();
    }

    // 1. QUÉT TỰ ĐỘNG TOÀN BỘ ẢNH THỰC TẾ TRONG THƯ MỤC TRÊN GITHUB REPO
    async function fetchImagesFromGithubFolder(folderName) {
      const tray = document.getElementById('tray-grid');
      const countEl = document.getElementById('category-count');
      const isSoil = (folderName === 'nendat');

      if (repoImageCache[folderName]) {
        renderTrayList(repoImageCache[folderName], isSoil);
        return;
      }

      tray.innerHTML = `<div class="col-span-3 text-center text-white/80 text-[10px] py-4"><i class="fa-solid fa-spinner animate-spin"></i> Đang quét thư mục...</div>`;

      const apiUrl = `https://api.github.com/repos/${GITHUB_REPO_INFO.owner}/${GITHUB_REPO_INFO.repo}/contents/${GITHUB_REPO_INFO.basePath}/${folderName}?ref=${GITHUB_REPO_INFO.branch}`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
        
        const data = await response.json();
        const validExts = ['.png', '.jpg', '.jpeg', '.webp', '.svg'];
        
        // Quét lấy mọi file ảnh thực tế có trong thư mục
        const imageList = data
          .filter(item => item.type === 'file' && validExts.some(ext => item.name.toLowerCase().endsWith(ext)))
          .map(item => ({ name: item.name, url: item.download_url }));

        repoImageCache[folderName] = imageList;
        renderTrayList(imageList, isSoil);

      } catch (err) {
        console.warn("GitHub API quét không thành công, thử cơ chế dò dự phòng...", err);
        // Cơ chế dự phòng dùng đường dẫn tương đối trực tiếp
        fallbackScan(folderName, isSoil);
      }
    }

    async function fallbackScan(folderName, isSoil) {
      const foundList = [];
      for (let i = 1; i <= 15; i++) {
        const testPath = `assets/${folderName}/${folderName.replace('cap1','')}${i}.png`;
        const exists = await new Promise((res) => {
          const img = new Image();
          img.onload = () => res(true);
          img.onerror = () => res(false);
          img.src = testPath;
        });
        if (exists) foundList.push({ name: `${i}.png`, url: testPath });
      }
      repoImageCache[folderName] = foundList;
      renderTrayList(foundList, isSoil);
    }

    function renderTrayList(list, isSoil) {
      const tray = document.getElementById('tray-grid');
      const countEl = document.getElementById('category-count');
      if (countEl) countEl.innerText = `(${list.length} mục)`;

      if (!list || list.length === 0) {
        tray.innerHTML = `<div class="col-span-3 text-center text-amber-200 text-[10px] py-4">Không tìm thấy ảnh trong thư mục!</div>`;
        return;
      }

      tray.innerHTML = list.map(item => `
        <div draggable="true" ondragstart="handleDragStart(event, '${item.url}', ${isSoil})" 
             class="rounded-xl border bg-white/10 hover:border-emerald-400 p-1 flex items-center justify-center h-16 cursor-grab transition"
             title="${item.name}">
          <img src="${item.url}" class="max-h-full object-contain pointer-events-none">
        </div>
      `).join('');
    }

    function renderDynamicButtons() {
      const bar = document.getElementById('dynamic-button-bar');
      bar.innerHTML = BUTTON_CATEGORIES.map(item => {
        const isActive = currentActiveButtonKey === item.key;
        return `
          <button onclick="switchButtonCategory('${item.key}')" class="rounded-xl border border-white/20 p-1 flex flex-col items-center transition ${isActive ? 'btn-cat-active' : 'bg-white/80 hover:bg-white text-slate-800'}">
            <img src="assets/nutgame/${item.key}" onerror="this.src='nutgame/${item.key}'" class="w-8 h-8 object-contain">
            <span class="text-[9px] font-black mt-0.5">${item.label}</span>
          </button>
        `;
      }).join('');
    }

    function switchButtonCategory(buttonKey) {
      currentActiveButtonKey = buttonKey;
      renderDynamicButtons();
      const item = BUTTON_CATEGORIES.find(b => b.key === buttonKey);
      if (item) fetchImagesFromGithubFolder(item.folder);
    }

    // 2. VÙNG CHỌN MÀU XANH: RÊ ĐƯỢC VÙNG CHỌN, CỤM NÚT COPY/XÓA GẮN LIỀN, 4 NÚT NEO Ở 4 GÓC CO DÃN
    function renderAdminPlots() {
      const container = document.getElementById('plots-container');
      if (!container) return;
      const slots = currentClass.config.plotSlots || [];
      const isAdmin = currentStudent && (currentStudent.role === 'TEACHER' || currentStudent.username === 'admin');

      container.innerHTML = slots.map(slot => {
        const isSelected = selectedPlotId === slot.id;
        const limitSP = getPlotAllowedProductsCount(slot.teamId);

        return `
          <div id="plot-box-${slot.id}" class="admin-plot-box ${slot.locked ? 'locked' : ''}"
               style="left: ${slot.left}%; top: ${slot.top}%; width: ${slot.width}%; height: ${slot.height}%;"
               onmousedown="startDragPlot('${slot.id}', event)"
               ondragover="handleDragOver(event)"
               ondrop="handleDropOnPlot(event, '${slot.id}', ${slot.teamId})">
            
            ${slot.soilImage ? `
              <img src="${slot.soilImage}" class="absolute inset-0 w-full h-full object-fill pointer-events-none rounded-xl">
              <button onclick="clearSoilFromSlot('${slot.id}',${slot.teamId}, event)" class="absolute top-1.5 right-1.5 w-6 h-6 rounded-full bg-rose-600 text-white font-black text-xs flex items-center justify-center shadow z-40 pointer-events-auto" title="Xóa nền đất">✕</button>
            ` : ''}

            <!-- Nhãn tên khu đất ở giữa -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
              <div class="px-4 py-1.5 bg-emerald-700/90 border-2 border-white rounded-full shadow-lg text-white font-black text-xs flex items-center gap-1.5">
                <i class="fa-solid fa-seedling"></i> ${slot.name} (${limitSP} SP)
              </div>
            </div>

            <!-- THANH CÔNG CỤ (COPY, KHÓA, XÓA) GẮN TRỰC TIẾP LÊN VÙNG CHỌN -->
            ${(isAdmin && isSelected && !slot.locked) ? `
              <div style="position: absolute; top: -38px; left: 0px;" class="flex items-center gap-1.5 z-50 pointer-events-auto" onmousedown="event.stopPropagation()">
                <button onclick="copyPlot('${slot.id}', event)" class="px-2 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white flex items-center gap-1 shadow-md text-xs cursor-pointer border border-white font-bold" title="Sao chép tạo thêm vùng chọn">
                  <i class="fa-solid fa-copy"></i> Sao chép
                </button>
                <button onclick="toggleLockPlot('${slot.id}', event)" class="w-7 h-7 rounded-lg bg-slate-700 hover:bg-slate-800 text-white flex items-center justify-center shadow-md text-xs cursor-pointer border border-white" title="Khóa">
                  <i class="fa-solid fa-lock-open"></i>
                </button>
                <button onclick="deletePlot('${slot.id}', event)" class="px-2 py-1 rounded-lg bg-rose-600 hover:bg-rose-700 text-white flex items-center gap-1 shadow-md text-xs cursor-pointer border border-white font-bold" title="Xóa vùng chọn">
                  <i class="fa-solid fa-trash-can"></i> Xóa
                </button>
              </div>

              <!-- 4 NÚT NEO Ở 4 GÓC ĐIỀU CHỈNH KÍCH THƯỚC HÌNH DÁNG -->
              <div class="corner-node node-tl pointer-events-auto" onmousedown="startResizeNode('${slot.id}', 'tl', event)"></div>
              <div class="corner-node node-tr pointer-events-auto" onmousedown="startResizeNode('${slot.id}', 'tr', event)"></div>
              <div class="corner-node node-bl pointer-events-auto" onmousedown="startResizeNode('${slot.id}', 'bl', event)"></div>
              <div class="corner-node node-br pointer-events-auto" onmousedown="startResizeNode('${slot.id}', 'br', event)"></div>
            ` : ''}

            ${(isAdmin && isSelected && slot.locked) ? `
              <div style="position: absolute; top: -38px; left: 0px;" class="flex items-center gap-1.5 z-50 pointer-events-auto" onmousedown="event.stopPropagation()">
                <button onclick="toggleLockPlot('${slot.id}', event)" class="px-2.5 py-1 rounded-lg bg-amber-600 text-white flex items-center gap-1 shadow-md text-xs border border-white font-bold">
                  <i class="fa-solid fa-lock"></i> Mở khóa
                </button>
              </div>
            ` : ''}

          </div>
        `;
      }).join('');
    }

    // RÊ DI CHUYỂN NGUYÊN VÙNG CHỌN
    function startDragPlot(plotId, e) {
      const isAdmin = currentStudent && (currentStudent.role === 'TEACHER' || currentStudent.username === 'admin');
      if (!isAdmin || e.target.classList.contains('corner-node') || e.target.closest('button')) return;

      selectedPlotId = plotId;
      renderAdminPlots();

      const slot = currentClass.config.plotSlots.find(s => s.id === plotId);
      if (!slot || slot.locked) return;

      const sectionA = document.getElementById('section-a');
      const rect = sectionA.getBoundingClientRect();
      const cW = rect.width || 800;
      const cH = rect.height || 600;

      let startX = e.clientX;
      let startY = e.clientY;
      let initialLeft = slot.left;
      let initialTop = slot.top;

      const onMouseMove = (moveEvent) => {
        const dx = ((moveEvent.clientX - startX) / cW) * 100;
        const dy = ((moveEvent.clientY - startY) / cH) * 100;
        slot.left = Math.max(0, Math.min(100 - slot.width, Math.round((initialLeft + dx) * 10) / 10));
        slot.top = Math.max(0, Math.min(100 - slot.height, Math.round((initialTop + dy) * 10) / 10));
        renderAdminPlots();
      };

      const onMouseUp = () => {
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
        saveClassToFirebase();
      };

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
      e.stopPropagation();
    }

    // CO DÃN VÙNG CHỌN QUA 4 NÚT NEO GÓC
    function startResizeNode(plotId, corner, e) {
      e.stopPropagation();
      const slot = currentClass.config.plotSlots.find(s => s.id === plotId);
      if (!slot || slot.locked) return;

      const sectionA = document.getElementById('section-a');
      const rect = sectionA.getBoundingClientRect();
      const cW = rect.width || 800;
      const cH = rect.height || 600;

      let startX = e.clientX;
      let startY = e.clientY;
      let initialL = slot.left;
      let initialT = slot.top;
      let initialW = slot.width;
      let initialH = slot.height;

      const onMouseMove = (moveEvent) => {
        const dx = ((moveEvent.clientX - startX) / cW) * 100;
        const dy = ((moveEvent.clientY - startY) / cH) * 100;

        if (corner === 'br') {
          slot.width = Math.max(12, Math.min(100 - slot.left, Math.round((initialW + dx) * 10) / 10));
          slot.height = Math.max(12, Math.min(100 - slot.top, Math.round((initialH + dy) * 10) / 10));
        } else if (corner === 'bl') {
          const newW = Math.max(12, Math.round((initialW - dx) * 10) / 10);
          slot.left = Math.max(0, initialL + (initialW - newW));
          slot.width = newW;
          slot.height = Math.max(12, Math.min(100 - slot.top, Math.round((initialH + dy) * 10) / 10));
        } else if (corner === 'tr') {
          const newH = Math.max(12, Math.round((initialH - dy) * 10) / 10);
          slot.top = Math.max(0, initialT + (initialH - newH));
          slot.height = newH;
          slot.width = Math.max(12, Math.min(100 - slot.left, Math.round((initialW + dx) * 10) / 10));
        } else if (corner === 'tl') {
          const newW = Math.max(12, Math.round((initialW - dx) * 10) / 10);
          const newH = Math.max(12, Math.round((initialH - dy) * 10) / 10);
          slot.left = Math.max(0, initialL + (initialW - newW));
          slot.top = Math.max(0, initialT + (initialH - newH));
          slot.width = newW;
          slot.height = newH;
        }
        renderAdminPlots();
      };

      const onMouseUp = () => {
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
        saveClassToFirebase();
      };

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
    }

    function copyPlot(plotId, e) {
      if (e) e.stopPropagation();
      const slot = currentClass.config.plotSlots.find(s => s.id === plotId);
      if (!slot) return;
      const nextIndex = currentClass.config.plotSlots.length + 1;
      const newId = 'slot_' + nextIndex;

      currentClass.config.plotSlots.push({
        id: newId,
        name: `Khu đất ${nextIndex}`,
        teamId: nextIndex,
        left: Math.min(48, slot.left + 4),
        top: Math.min(48, slot.top + 4),
        width: slot.width,
        height: slot.height,
        locked: false,
        soilImage: null
      });

      selectedPlotId = newId;
      renderAdminPlots();
      saveClassToFirebase();
    }

    function toggleLockPlot(plotId, e) {
      if (e) e.stopPropagation();
      const slot = currentClass.config.plotSlots.find(s => s.id === plotId);
      if (slot) {
        slot.locked = !slot.locked;
        renderAdminPlots();
        saveClassToFirebase();
      }
    }

    function deletePlot(plotId, e) {
      if (e) e.stopPropagation();
      if (currentClass.config.plotSlots.length <= 1) {
        return alert('Cần giữ lại ít nhất 1 khu đất!');
      }
      currentClass.config.plotSlots = currentClass.config.plotSlots.filter(s => s.id !== plotId);
      selectedPlotId = currentClass.config.plotSlots[0].id;
      renderAdminPlots();
      saveClassToFirebase();
    }

    function handleDragStart(e, rawUrl, isSoil) {
      draggedItemData = { rawUrl, isSoil };
      e.dataTransfer.setData('text/plain', '');
    }
    function handleDragOver(e) { e.preventDefault(); }

    function handleDropOnPlot(e, plotId, teamId) {
      e.preventDefault();
      if (!draggedItemData) return;
      const perm = checkPermissionOnPlot(teamId);
      if (!perm.allowed) return alert(perm.msg);

      const slot = currentClass.config.plotSlots.find(s => s.id === plotId);

      if (draggedItemData.isSoil) {
        slot.soilImage = draggedItemData.rawUrl;
        renderAdminPlots();
        saveClassToFirebase();
      } else {
        const placedCount = (currentClass.placedFlowers || []).filter(f => parseInt(f.teamId) === teamId).length;
        const limit = getPlotAllowedProductsCount(teamId);
        if (placedCount >= limit) {
          return alert(`Khu đất ${teamId} chỉ được phép trồng tối đa ${limit} hoa/sản phẩm!`);
        }

        const sectionA = document.getElementById('section-a');
        const rect = sectionA.getBoundingClientRect();
        let dropX = e.clientX - rect.left;
        let dropY = e.clientY - rect.top;

        spawnFlowerOnCanvas(draggedItemData.rawUrl, dropX, dropY, teamId, true);
      }
    }

    function clearSoilFromSlot(plotId, teamId, event) {
      event.stopPropagation();
      const perm = checkPermissionOnPlot(teamId);
      if (!perm.allowed) return alert(perm.msg);
      currentClass.config.plotSlots.find(s => s.id === plotId).soilImage = null;
      renderAdminPlots();
      saveClassToFirebase();
    }

    let flowerCounter = 0;
    function spawnFlowerOnCanvas(rawUrl, posX, posY, teamId, shouldSave = false) {
      const container = document.getElementById('drop-flowers-layer');
      flowerCounter++;
      const id = 'flower_' + flowerCounter;
      const scale = getGrowthScaleMultiplier(teamId);

      const el = document.createElement('div');
      el.id = id; el.dataset.teamId = teamId; el.dataset.rawUrl = rawUrl;
      el.className = 'garden-placed-flower flex items-center justify-center';
      el.style.width = `${Math.round(80 * scale)}px`; el.style.height = `${Math.round(100 * scale)}px`;
      el.style.left = `${posX}px`; el.style.top = `${posY}px`;
      el.innerHTML = `<div class="relative group"><img src="${rawUrl}" class="max-h-full object-contain"><button onclick="removeFlower('${id}', ${teamId}, event)" class="absolute -top-2 -right-2 w-4 h-4 rounded-full bg-rose-500 text-white text-[8px] hidden group-hover:flex items-center justify-center">✕</button></div>`;
      
      makeElementDraggable(el, teamId);
      container.appendChild(el);
      if (shouldSave) savePlacedFlowersState();
    }

    function savePlacedFlowersState() {
      if (!activeClassName) return;
      const elements = document.querySelectorAll('#drop-flowers-layer > div');
      let data = [];
      elements.forEach(el => data.push({ id: el.id, teamId: el.dataset.teamId, rawUrl: el.dataset.rawUrl, left: el.style.left, top: el.style.top }));
      currentClass.placedFlowers = data;
      saveClassToFirebase();
    }

    function restorePlacedFlowers() {
      const container = document.getElementById('drop-flowers-layer');
      container.innerHTML = '';
      if (!currentClass.placedFlowers) return;
      currentClass.placedFlowers.forEach(item => spawnFlowerOnCanvas(item.rawUrl, parseFloat(item.left), parseFloat(item.top), item.teamId, false));
    }

    function makeElementDraggable(el, teamId) {
      let isDragging = false, startX, startY, initL, initT;
      el.addEventListener('mousedown', (e) => {
        if (e.target.tagName === 'BUTTON') return;
        if (checkPermissionOnPlot(teamId).allowed) { isDragging = true; startX = e.clientX; startY = e.clientY; initL = el.offsetLeft; initT = el.offsetTop; el.style.zIndex = 100; }
      });
      window.addEventListener('mousemove', (e) => { if (isDragging) { el.style.left = `${initL + (e.clientX - startX)}px`; el.style.top = `${initT + (e.clientY - startY)}px`; } });
      window.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; el.style.zIndex = 25; savePlacedFlowersState(); } });
    }

    function removeFlower(id, teamId, event) {
      event.stopPropagation();
      const perm = checkPermissionOnPlot(teamId);
      if (!perm.allowed) return alert(perm.msg);
      document.getElementById(id)?.remove();
      savePlacedFlowersState();
    }

    function clearPlacedGardenFlowers() {
      document.getElementById('drop-flowers-layer').innerHTML = '';
      savePlacedFlowersState();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderDynamicButtons();
      renderAdminPlots();
      switchButtonCategory('nutnu.png');
    });
  </script>
</body>
</html>
