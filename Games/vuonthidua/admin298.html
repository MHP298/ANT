<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vườn Thi Đua Trồng Hoa - Sân Chơi Lớp Học</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* BỘ LỌC VIỀN NÂU ĐẬM BÁM SÁT ĐƯỜNG NÉT HOA TRONG SUỐT */
    .flower-outline {
      filter: drop-shadow(0 0 1.2px #451a03) 
              drop-shadow(0 0 2px #78350f) 
              drop-shadow(0 4px 6px rgba(41, 15, 2, 0.7));
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .flower-outline:hover {
      transform: scale(1.12);
      filter: drop-shadow(0 0 2px #b45309) 
              drop-shadow(0 0 4px #f59e0b) 
              drop-shadow(0 6px 8px rgba(41, 15, 2, 0.8));
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
    ::-webkit-scrollbar-thumb { background: rgba(120, 53, 15, 0.5); border-radius: 4px; }
    
    .garden-placed-item {
      position: absolute;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }
    .garden-placed-item:active { cursor: grabbing; }
  </style>
</head>
<body id="game-wrapper" class="bg-cover bg-center h-screen w-screen overflow-hidden flex flex-col font-sans select-none" style="background-image: url('assets/nengame/nenungdung.jpg');">

  <!-- THANH HEADER GỌN GÀNG -->
  <header class="h-11 bg-white/90 backdrop-blur-md border-b border-black/10 px-4 flex items-center justify-between z-30 shrink-0 shadow-sm">
    <div class="flex items-center gap-2">
      <span class="text-xl">🌸</span>
      <h1 class="font-extrabold text-sm text-emerald-950 uppercase tracking-wide">Vườn Thi Đua Trồng Hoa</h1>
      <span class="text-[11px] px-2 py-0.5 bg-emerald-100 text-emerald-900 rounded-full font-bold ml-2">Lớp 10A1</span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="clearPlacedItems()" class="px-2.5 py-1 text-[11px] font-bold rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100 transition flex items-center gap-1 border border-rose-200">
        <i class="fa-solid fa-trash-can"></i> Dọn Sân
      </button>
      <div class="text-xs text-slate-700 font-semibold border-l pl-3 border-slate-300">
        Tài khoản: <b class="text-emerald-800">hocsinh (Tổ 1 - Hạng 1 ★)</b>
      </div>
    </div>
  </header>

  <!-- BỐ CỤC CHÍNH 2 PHẦN -->
  <div class="flex-1 flex flex-row h-[calc(100vh-44px)] overflow-hidden">
    
    <!-- PHẦN A: BÊN TRÁI (SÂN CHƠI NỀN GAME) -->
    <section id="section-a" class="flex-1 relative bg-slate-950 overflow-hidden flex items-center justify-center border-r-4 border-black/20" ondragover="handleDragOver(event)" ondrop="handleDrop(event)">
      <img id="game-bg-image" src="assets/nengame/vuonlop.jpg" alt="Nền Game" onerror="this.src='https://raw.githubusercontent.com/MHP298/ANT/main/Games/vuonthidua/assets/anhnen/vuonlop.jpg'" class="absolute inset-0 w-full h-full object-fill pointer-events-none transition-all duration-300">
      <div id="drop-container" class="absolute inset-0 w-full h-full z-10 pointer-events-auto"></div>
      <div id="empty-hint" class="absolute bottom-4 left-4 z-20 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-xl border border-white/20 text-white text-xs pointer-events-none flex items-center gap-2">
        <i class="fa-solid fa-hand-pointer text-amber-400"></i>
        <span>Kéo các vật phẩm từ <b>Phần B</b> thả vào đây!</span>
      </div>
    </section>

    <!-- PHẦN B: BÊN PHẢI (NỀN GỖ RIÊNG BIỆT) -->
    <aside id="section-b" class="w-80 md:w-96 lg:w-[400px] bg-cover bg-center flex flex-col h-full shadow-2xl shrink-0 border-l border-black/20" style="background-image: url('assets/nengame/nenungdung.jpg');">
      
      <!-- B1: 4 NÚT ĐƯỢC ADMIN GÁN THƯ MỤC -->
      <div class="p-3 bg-black/20 backdrop-blur-xs border-b border-black/10 shadow-sm space-y-2 shrink-0">
        <div class="text-[10px] font-black uppercase text-amber-100 drop-shadow tracking-wide">CHỌN THƯ MỤC VẬT PHẨM:</div>
        <div class="grid grid-cols-4 gap-2" id="dynamic-button-bar"></div>
      </div>

      <!-- B2: KHAY HIỂN THỊ CÁC ẢNH (KHÔNG HIỆN CHỮ, CHỈ CÓ VIỀN ĐẬM BÁM NÉT) -->
      <div class="flex-1 overflow-y-auto p-3.5 flex flex-col bg-black/15 backdrop-blur-[2px]">
        <div class="flex items-center justify-between mb-2">
          <span id="category-title" class="text-xs font-black uppercase text-amber-100 drop-shadow tracking-wider">VẬT PHẨM</span>
          <span class="text-[10px] text-amber-200/80 font-bold">Kéo hoặc bấm để đặt</span>
        </div>
        
        <!-- Lưới ảnh vật phẩm không chữ -->
        <div id="tray-grid" class="grid grid-cols-2 gap-3"></div>
      </div>

    </aside>

  </div>

  <script>
    const GITHUB_RAW_BASE = 'https://raw.githubusercontent.com/MHP298/ANT/main/Games/vuonthidua/';

    // CẤU HÌNH HỆ THỐNG
    let config = {
      bgGlobal: 'assets/nengame/nenungdung.jpg',
      bgA: 'assets/nengame/vuonlop.jpg',
      bgB: 'assets/nengame/nenungdung.jpg',
      buttons: {
        btn1: { label: 'HOA', icon: 'assets/nutgame/nuthoa.png', targetFolder: 'hoacap1' },
        btn2: { label: 'NỤ', icon: 'assets/nutgame/nutnu.png', targetFolder: 'nucap1' },
        btn3: { label: 'ĐẤT', icon: 'assets/nutgame/nutchunhat.png', targetFolder: 'nengame' },
        btn4: { label: 'CÔNG CỤ', icon: 'assets/nutgame/nutxeng.png', targetFolder: 'congcu' }
      },
      unlockRules: {
        hoacap1: { rule: 'always', forceOpen: true },
        nucap1:  { rule: 'always', forceOpen: true },
        hoacap2: { rule: 'rank_top1', forceOpen: false },
        nucap2:  { rule: 'rank_top1', forceOpen: false },
        congcu:  { rule: 'quest_done', forceOpen: false },
        nengame: { rule: 'always', forceOpen: true }
      }
    };

    // THÔNG TIN HỌC SINH ĐANG ĐĂNG NHẬP
    let currentStudent = {
      name: 'Học Sinh Thử Nghiệm',
      team: 1,
      teamRank: 1,           // Tổ 1 đang đạt Hạng 1 tuần
      isQuestDoneToday: true  // Đã hoàn thành nhiệm vụ ngày
    };

    let allAssets = {};
    let activeFolder = 'hoacap1';
    let draggedItemData = null;

    function initGame() {
      // 1. Đọc cấu hình từ Admin
      const savedConfig = localStorage.getItem('garden_system_config_v3');
      if (savedConfig) {
        try { config = { ...config, ...JSON.parse(savedConfig) }; } catch (e) {}
      }

      // 2. Nạp ảnh nền 3 vùng
      document.getElementById('game-wrapper').style.backgroundImage = `url('${config.bgGlobal}')`;
      document.getElementById('game-bg-image').src = config.bgA;
      document.getElementById('section-b').style.backgroundImage = `url('${config.bgB}')`;

      // 3. Đọc kho ảnh đã quét tự động từ admin
      const scanned = localStorage.getItem('garden_auto_scanned_assets');
      if (scanned) {
        try { allAssets = JSON.parse(scanned); } catch (e) {}
      }

      // 4. Nếu chưa có ảnh trong cache, tự động quét fallback từ GitHub API
      if (!allAssets || Object.keys(allAssets).length === 0) {
        fetchFallbackAssets();
      } else {
        renderUI();
      }
    }

    async function fetchFallbackAssets() {
      const folders = ['hoacap1', 'hoacap2', 'nucap1', 'nucap2', 'congcu', 'nengame', 'nutgame'];
      for (const f of folders) {
        try {
          const res = await fetch(`https://api.github.com/repos/MHP298/ANT/contents/Games/vuonthidua/assets/${f}`);
          if (res.ok) {
            const data = await res.json();
            allAssets[f] = data.filter(i => /\.(png|jpe?g|webp|svg)$/i.test(i.name)).map(i => ({
              fileName: i.name,
              localPath: `assets/${f}/${i.name}`,
              rawUrl: `${GITHUB_RAW_BASE}assets/${f}/${i.name}`
            }));
          }
        } catch (e) {}
      }
      renderUI();
    }

    function renderUI() {
      renderDynamicButtons();
      switchFolder(config.buttons.btn1.targetFolder);
    }

    function renderDynamicButtons() {
      const bar = document.getElementById('dynamic-button-bar');
      bar.innerHTML = [1, 2, 3, 4].map(i => {
        const btn = config.buttons[`btn${i}`];
        return `
          <button onclick="switchFolder('${btn.targetFolder}')" id="btn-folder-${btn.targetFolder}" class="group relative rounded-xl border border-white/20 bg-white/80 hover:bg-white p-1 transition flex flex-col items-center justify-center">
            <img src="${btn.icon}" onerror="this.src='https://raw.githubusercontent.com/MHP298/ANT/main/Games/vuonthidua/assets/congcu/nut_hoa.png'" class="w-10 h-10 object-contain drop-shadow">
            <span class="text-[10px] font-bold text-slate-800 mt-0.5">${btn.label}</span>
          </button>
        `;
      }).join('');
    }

    function switchFolder(folderName) {
      activeFolder = folderName;
      const allButtons = document.querySelectorAll('#dynamic-button-bar button');
      allButtons.forEach(b => {
        b.className = "group relative rounded-xl border border-white/20 bg-white/80 hover:bg-white p-1 transition flex flex-col items-center justify-center";
      });
      const activeBtn = document.getElementById(`btn-folder-${folderName}`);
      if (activeBtn) {
        activeBtn.className = "group relative rounded-xl border-2 border-emerald-600 bg-white p-1 shadow-md transition flex flex-col items-center justify-center scale-105";
      }

      document.getElementById('category-title').innerText = `THƯ MỤC: ${folderName.toUpperCase()}`;
      renderTrayItems();
    }

    // KIỂM TRA ĐIỀU KIỆN MỞ KHÓA THƯ MỤC
    function isFolderLocked(folderName) {
      const ruleObj = config.unlockRules[folderName];
      if (!ruleObj) return false;
      if (ruleObj.forceOpen) return false; // Nút gạt "Mở ngay" từ Admin

      if (ruleObj.rule === 'always') return false;
      if (ruleObj.rule === 'locked') return true;

      // Điều kiện đạt Hạng 1 tuần
      if (ruleObj.rule === 'rank_top1') {
        return currentStudent.teamRank !== 1;
      }

      // Điều kiện hoàn thành nhiệm vụ ngày
      if (ruleObj.rule === 'quest_done') {
        return !currentStudent.isQuestDoneToday;
      }

      return false;
    }

    // HIỂN THỊ CÁC ẢNH TRONG KHAY (KHÔNG CHỮ, VIỀN NÂU NỔI KHỐI)
    function renderTrayItems() {
      const tray = document.getElementById('tray-grid');
      const items = allAssets[activeFolder] || [];
      const locked = isFolderLocked(activeFolder);

      if (items.length === 0) {
        tray.innerHTML = `<div class="col-span-2 text-center text-amber-100/60 text-xs py-10">Thư mục chưa có file ảnh nào.</div>`;
        return;
      }

      tray.innerHTML = items.map((item, idx) => {
        if (locked) {
          // GIAO DIỆN BỊ KHÓA: MỜ + Ổ KHÓA (KHÔNG HIỆN CHỮ TÊN FILE)
          return `
            <div class="relative rounded-2xl border border-black/20 bg-black/20 p-3 flex items-center justify-center h-28 overflow-hidden select-none cursor-not-allowed">
              <img src="${item.rawUrl}" class="max-h-full max-w-full object-contain opacity-25 filter grayscale">
              <div class="absolute inset-0 flex flex-col items-center justify-center text-white">
                <div class="w-8 h-8 rounded-full bg-slate-950/80 flex items-center justify-center shadow-lg border border-amber-400">
                  <i class="fa-solid fa-lock text-amber-400 text-sm"></i>
                </div>
                <span class="text-[9px] font-black text-amber-300 mt-1 uppercase tracking-wider">Đang Khóa</span>
              </div>
            </div>
          `;
        }

        // GIAO DIỆN MỞ: ẢNH TRONG SUỐT VỚI LỚP VIỀN NÂU ĐẬM BÁM NÉT
        return `
          <div draggable="true" 
               ondragstart="handleDragStart(event, '${activeFolder}', ${idx})"
               onclick="placeItemInCenter('${activeFolder}', ${idx})"
               class="group relative rounded-2xl border border-white/10 hover:border-amber-400/60 bg-white/10 hover:bg-white/20 p-2.5 flex items-center justify-center h-28 transition cursor-grab active:cursor-grabbing">
            
            <!-- ẢNH KHÔNG CÒN CHỮ, CHỈ ĐỔ VIỀN NÂU SẮC NÉT THEO TỪNG CÁNH HOA -->
            <img src="${item.rawUrl}" class="max-h-full max-w-full object-contain flower-outline pointer-events-none">

            <!-- Icon gợi ý di chuyển nhỏ góc phải -->
            <i class="fa-solid fa-up-down-left-right text-[10px] text-amber-200/40 absolute top-2 right-2 group-hover:text-amber-300"></i>
          </div>
        `;
      }).join('');
    }

    // XỬ LÝ DRAG & DROP SANG PHẦN A
    function handleDragStart(e, folder, index) {
      draggedItemData = allAssets[folder][index];
      e.dataTransfer.setData('text/plain', '');
    }
    function handleDragOver(e) { e.preventDefault(); }
    function handleDrop(e) {
      e.preventDefault();
      const rect = document.getElementById('section-a').getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      if (draggedItemData) spawnItemOnCanvas(draggedItemData, x, y);
    }

    function placeItemInCenter(folder, index) {
      const item = allAssets[folder][index];
      if (!item) return;
      const canvas = document.getElementById('section-a');
      spawnItemOnCanvas(item, canvas.clientWidth / 2, canvas.clientHeight / 2);
    }

    let placedItemCount = 0;
    function spawnItemOnCanvas(item, posX, posY) {
      document.getElementById('empty-hint').style.display = 'none';
      const container = document.getElementById('drop-container');
      placedItemCount++;
      const uniqueId = 'placed_' + placedItemCount;

      const isGround = item.fileName.includes('dat') || item.fileName.includes('nau');
      const defaultSize = isGround ? 'w-56 h-48' : 'w-24 h-28';

      const el = document.createElement('div');
      el.id = uniqueId;
      el.className = `garden-placed-item ${defaultSize} flex items-center justify-center`;
      el.style.left = `${posX - 40}px`;
      el.style.top = `${posY - 40}px`;
      el.innerHTML = `
        <div class="relative w-full h-full group flex items-center justify-center">
          <img src="${item.rawUrl}" class="max-h-full max-w-full object-contain flower-outline pointer-events-none">
          <button onclick="removePlacedItem('${uniqueId}', event)" class="absolute -top-2 -right-2 w-5 h-5 rounded-full bg-rose-500 hover:bg-rose-600 text-white text-[10px] font-bold shadow hidden group-hover:flex items-center justify-center">✕</button>
        </div>
      `;
      makeDraggable(el);
      container.appendChild(el);
    }

    function makeDraggable(element) {
      let isDragging = false;
      let startX, startY, initialLeft, initialTop;

      element.addEventListener('mousedown', (e) => {
        if (e.target.tagName === 'BUTTON') return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initialLeft = element.offsetLeft;
        initialTop = element.offsetTop;
        element.style.zIndex = 100;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        element.style.left = `${initialLeft + (e.clientX - startX)}px`;
        element.style.top = `${initialTop + (e.clientY - startY)}px`;
      });

      window.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          element.style.zIndex = 10;
        }
      });
    }

    function removePlacedItem(id, event) {
      event.stopPropagation();
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function clearPlacedItems() {
      if (confirm('Dọn sạch các vật phẩm trên sân?')) {
        document.getElementById('drop-container').innerHTML = '';
        document.getElementById('empty-hint').style.display = 'flex';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initGame();
    });
  </script>
</body>
</html>
