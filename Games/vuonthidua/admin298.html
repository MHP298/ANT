<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin298 - Quản Trị Hệ Thống Trồng Hoa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .bg-trans-grid {
      background-color: #ffffff;
      background-image: linear-gradient(45deg, #f1f5f9 25%, transparent 25%), 
                        linear-gradient(-45deg, #f1f5f9 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #f1f5f9 75%), 
                        linear-gradient(-45deg, transparent 75%, #f1f5f9 75%);
      background-size: 14px 14px;
      background-position: 0 0, 0 7px, 7px -7px, -7px 0px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- POPUP ĐĂNG NHẬP -->
  <div id="login-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 border border-slate-200">
      <div class="text-center mb-5">
        <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto text-2xl mb-2">🌸</div>
        <h2 class="text-xl font-bold text-slate-800">Admin298 Panel</h2>
        <p class="text-xs text-slate-500">Tự động quét assets & cấu hình nền game</p>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tài khoản</label>
          <input type="text" id="login-user" autocomplete="off" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Mật khẩu</label>
          <div class="relative">
            <input type="password" id="login-pass" autocomplete="off" class="w-full px-3.5 py-2 pr-10 text-sm rounded-xl border border-slate-300">
            <button type="button" onclick="togglePasswordVisibility('login-pass', 'eye-icon-login')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400">
              <i id="eye-icon-login" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <div id="login-error" class="hidden text-rose-500 text-xs font-semibold text-center"></div>
        <button onclick="handleLogin()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl shadow-md transition">
          Đăng Nhập
        </button>
      </div>
    </div>
  </div>

  <!-- HEADER -->
  <header class="bg-white border-b border-slate-200 px-6 py-3 sticky top-0 z-30 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
      <span class="text-2xl text-emerald-600"><i class="fa-brands fa-github"></i></span>
      <div>
        <h1 class="font-bold text-base text-slate-800 leading-tight">Admin298 - Game Controller</h1>
        <p class="text-[11px] text-slate-500 font-mono">Repo: MHP298/ANT/Games/vuonthidua/assets</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="syncAllFromGitHub()" class="px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-bold flex items-center gap-1.5 transition">
        <i class="fa-solid fa-rotate text-emerald-600" id="sync-icon"></i> Quét Lại GitHub
      </button>
      <button onclick="saveAndApplyToGame()" class="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-sm transition">
        <i class="fa-solid fa-floppy-disk"></i> Lưu & Áp Dụng Sang Game
      </button>
      <button onclick="handleLogout()" class="px-3 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold">
        Đăng Xuất
      </button>
    </div>
  </header>

  <!-- BỐ CỤC CHÍNH 2 PHẦN -->
  <div id="admin-app" class="hidden flex-1 flex flex-col md:flex-row h-[calc(100vh-57px)] overflow-hidden">
    
    <!-- PHẦN A (1/3 TRÁI): CẤU HÌNH HÌNH NỀN VÀ NÚT -->
    <aside class="w-full md:w-1/3 border-r border-slate-200 bg-white flex flex-col h-full shadow-sm overflow-y-auto p-4 space-y-4">
      
      <!-- KHU VỰC CẤU HÌNH 3 LOẠI NỀN -->
      <div class="p-3.5 bg-slate-50 rounded-2xl border border-slate-200 space-y-3">
        <h4 class="text-xs font-black uppercase text-emerald-800 flex items-center gap-1.5">
          <i class="fa-regular fa-image"></i> Cấu Hình Nền Giao Diện
        </h4>

        <!-- Nền Toàn Game -->
        <div>
          <label class="block text-[11px] text-slate-600 font-bold mb-0.5">1. Nền Bao Quanh Toàn Game:</label>
          <div class="flex gap-1.5">
            <input type="text" id="cfg-bg-global" value="assets/nengame/nenungdung.jpg" class="flex-1 px-2.5 py-1.5 text-xs rounded-lg border border-slate-300 font-mono">
            <select onchange="document.getElementById('cfg-bg-global').value = this.value" id="select-bg-global" class="w-24 text-[10px] border rounded-lg bg-white"></select>
          </div>
        </div>

        <!-- Nền Phần A -->
        <div>
          <label class="block text-[11px] text-slate-600 font-bold mb-0.5">2. Nền Sân Vườn (Phần A bên trái):</label>
          <div class="flex gap-1.5">
            <input type="text" id="cfg-bg-a" value="assets/nengame/vuonlop.jpg" class="flex-1 px-2.5 py-1.5 text-xs rounded-lg border border-slate-300 font-mono">
            <select onchange="document.getElementById('cfg-bg-a').value = this.value" id="select-bg-a" class="w-24 text-[10px] border rounded-lg bg-white"></select>
          </div>
        </div>

        <!-- Nền Phần B -->
        <div>
          <label class="block text-[11px] text-slate-600 font-bold mb-0.5">3. Nền Cột Công Cụ (Phần B bên phải):</label>
          <div class="flex gap-1.5">
            <input type="text" id="cfg-bg-b" value="assets/nengame/nenungdung.jpg" class="flex-1 px-2.5 py-1.5 text-xs rounded-lg border border-slate-300 font-mono">
            <select onchange="document.getElementById('cfg-bg-b').value = this.value" id="select-bg-b" class="w-24 text-[10px] border rounded-lg bg-white"></select>
          </div>
        </div>
      </div>

      <!-- KHU VỰC CẤU HÌNH 4 NÚT PHẦN B1 -->
      <div class="p-3.5 bg-slate-50 rounded-2xl border border-slate-200 space-y-3">
        <h4 class="text-xs font-black uppercase text-emerald-800 flex items-center gap-1.5">
          <i class="fa-solid fa-shapes"></i> Cấu Hình 4 Nút Bấm (Phần B1)
        </h4>

        <!-- Nút 1 đến 4 -->
        <div id="buttons-config-container" class="space-y-2"></div>
      </div>

      <!-- MỞ KHÓA HOA CẤP 2 -->
      <div class="p-3.5 bg-slate-50 rounded-2xl border border-slate-200">
        <label class="flex items-center gap-2 cursor-pointer text-xs font-semibold text-slate-700 select-none">
          <input type="checkbox" id="cfg-unlock-tier2" class="w-4 h-4 rounded text-emerald-600">
          <span>Mở khóa toàn bộ hoa & nụ VIP Cấp 2 (Bỏ mờ & bỏ khóa)</span>
        </label>
      </div>

    </aside>

    <!-- PHẦN B (2/3 PHẢI): DANH SÁCH FILE VÀ THƯ MỤC QUÉT ĐƯỢC TỪ GITHUB -->
    <main class="w-full md:w-2/3 flex flex-col h-full bg-slate-50">
      
      <!-- Thanh điều hướng thư mục -->
      <div class="bg-white border-b border-slate-200 p-3 flex flex-wrap items-center justify-between gap-2 shadow-xs">
        <div class="flex items-center gap-1.5 overflow-x-auto pb-1" id="folder-tabs-bar"></div>
        <span id="scan-status" class="text-xs text-emerald-700 font-bold hidden">
          <i class="fa-solid fa-spinner fa-spin"></i> Đang nạp...
        </span>
      </div>

      <!-- Lưới ảnh trong thư mục đang chọn -->
      <div class="flex-1 overflow-y-auto p-4 md:p-6">
        <div id="assets-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-3 lg:grid-cols-4 gap-3.5"></div>
      </div>

    </main>

  </div>

  <script>
    const GITHUB_OWNER = 'MHP298';
    const GITHUB_REPO = 'ANT';
    const ASSETS_PATH = 'Games/vuonthidua/assets';

    const FOLDERS = ['nengame', 'hoacap1', 'hoacap2', 'nucap1', 'nucap2', 'congcu', 'nutgame'];

    let state = {
      currentFolder: 'nengame',
      cachedAssets: {}, // { 'nengame': [ { fileName, displayName, path, rawUrl } ] }
      gameConfig: {
        bgGlobal: 'assets/nengame/nenungdung.jpg',
        bgA: 'assets/nengame/vuonlop.jpg',
        bgB: 'assets/nengame/nenungdung.jpg',
        unlockTier2: false,
        buttons: {
          btn1: { label: 'HOA', icon: 'assets/nutgame/nuthoa.png', action: 'hoa' },
          btn2: { label: 'NỤ', icon: 'assets/nutgame/nutnu.png', action: 'nu' },
          btn3: { label: 'ĐẤT', icon: 'assets/nutgame/nutchunhat.png', action: 'chunhat' },
          btn4: { label: 'CÔNG CỤ', icon: 'assets/nutgame/nutxeng.png', action: 'xeng' }
        }
      }
    };

    function togglePasswordVisibility(id, iconId) {
      const el = document.getElementById(id);
      const icon = document.getElementById(iconId);
      if (el.type === 'password') {
        el.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        el.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    function handleLogin() {
      const u = document.getElementById('login-user').value.trim();
      const p = document.getElementById('login-pass').value.trim();
      if (u === 'admin298' && p === '@dmjn298') {
        sessionStorage.setItem('current_admin_user', u);
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('admin-app').classList.remove('hidden');
        initAdmin();
      } else {
        document.getElementById('login-error').innerText = 'Sai tài khoản hoặc mật khẩu!';
        document.getElementById('login-error').classList.remove('hidden');
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('current_admin_user');
      location.reload();
    }

    function initAdmin() {
      loadSavedConfig();
      renderFolderTabs();
      renderButtonsConfigForm();
      syncAllFromGitHub();
    }

    function loadSavedConfig() {
      const saved = localStorage.getItem('garden_shared_config_v2');
      if (saved) {
        try { state.gameConfig = { ...state.gameConfig, ...JSON.parse(saved) }; } catch (e) {}
      }
      document.getElementById('cfg-bg-global').value = state.gameConfig.bgGlobal;
      document.getElementById('cfg-bg-a').value = state.gameConfig.bgA;
      document.getElementById('cfg-bg-b').value = state.gameConfig.bgB;
      document.getElementById('cfg-unlock-tier2').checked = state.gameConfig.unlockTier2;
    }

    function renderButtonsConfigForm() {
      const container = document.getElementById('buttons-config-container');
      container.innerHTML = [1, 2, 3, 4].map(i => {
        const btn = state.gameConfig.buttons[`btn${i}`];
        return `
          <div class="p-2.5 bg-white rounded-xl border border-slate-200 space-y-1.5 text-xs">
            <div class="flex items-center justify-between">
              <span class="font-bold text-slate-700">Nút ${i}:</span>
              <input type="text" id="cfg-btn${i}-label" value="${btn.label}" class="w-20 px-2 py-0.5 text-center border rounded font-bold">
            </div>
            <div class="grid grid-cols-2 gap-1.5 text-[11px]">
              <div>
                <span class="text-slate-400">Đường dẫn icon:</span>
                <input type="text" id="cfg-btn${i}-icon" value="${btn.icon}" class="w-full p-1 border rounded text-[10px] font-mono">
              </div>
              <div>
                <span class="text-slate-400">Thư mục mở ra:</span>
                <select id="cfg-btn${i}-act" class="w-full p-1 border rounded text-[10px] bg-slate-50">
                  <option value="hoa" ${btn.action === 'hoa' ? 'selected' : ''}>Hoa Cấp 1 & 2</option>
                  <option value="nu" ${btn.action === 'nu' ? 'selected' : ''}>Nụ Cấp 1 & 2</option>
                  <option value="chunhat" ${btn.action === 'chunhat' ? 'selected' : ''}>Ô Đất 3 Luống</option>
                  <option value="xeng" ${btn.action === 'xeng' ? 'selected' : ''}>Dụng Cụ Làm Vườn</option>
                </select>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderFolderTabs() {
      const container = document.getElementById('folder-tabs-bar');
      container.innerHTML = FOLDERS.map(f => {
        const isActive = f === state.currentFolder;
        const total = (state.cachedAssets[f] || []).length;
        return `
          <button onclick="switchFolder('${f}')" class="px-3 py-1 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap ${
            isActive ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'
          }">
            <i class="fa-solid fa-folder"></i> ${f}
            <span class="text-[10px] px-1.5 rounded-full ${isActive ? 'bg-emerald-700 text-white' : 'bg-slate-200 text-slate-600'}">${total}</span>
          </button>
        `;
      }).join('');
    }

    function switchFolder(folder) {
      state.currentFolder = folder;
      renderFolderTabs();
      renderAssetsGrid();
    }

    // TỰ ĐỘNG GỌI GITHUB API QUÉT TOÀN BỘ FILE VÀ THƯ MỤC
    async function syncAllFromGitHub() {
      const status = document.getElementById('scan-status');
      const icon = document.getElementById('sync-icon');
      status.classList.remove('hidden');
      icon.classList.add('fa-spin');

      for (const folder of FOLDERS) {
        try {
          const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${ASSETS_PATH}/${folder}`);
          if (res.ok) {
            const data = await res.json();
            state.cachedAssets[folder] = data.filter(item => 
              item.type === 'file' && /\.(png|jpe?g|webp|svg)$/i.test(item.name)
            ).map(item => ({
              fileName: item.name,
              displayName: item.name.replace(/\.[^/.]+$/, "").replace(/[_-]+/g, ' ').toUpperCase(),
              localPath: `assets/${folder}/${item.name}`,
              rawUrl: `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/${item.path}`
            }));
          }
        } catch (e) { console.error(e); }
      }

      status.classList.add('hidden');
      icon.classList.remove('fa-spin');
      populateBackgroundDropdowns();
      renderFolderTabs();
      renderAssetsGrid();
    }

    function populateBackgroundDropdowns() {
      const bgFiles = state.cachedAssets['nengame'] || [];
      const optionsHtml = `<option value="">(Chọn nhanh ảnh)</option>` + 
        bgFiles.map(b => `<option value="${b.localPath}">${b.fileName}</option>`).join('');
      
      document.getElementById('select-bg-global').innerHTML = optionsHtml;
      document.getElementById('select-bg-a').innerHTML = optionsHtml;
      document.getElementById('select-bg-b').innerHTML = optionsHtml;
    }

    function renderAssetsGrid() {
      const grid = document.getElementById('assets-grid');
      const list = state.cachedAssets[state.currentFolder] || [];

      if (list.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-400 bg-white rounded-2xl border border-dashed border-slate-300">
            <i class="fa-regular fa-image text-3xl mb-1"></i>
            <p class="text-xs font-bold">Thư mục [${state.currentFolder}] chưa có file nào trên GitHub.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = list.map(item => `
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs hover:shadow-md p-2.5 flex flex-col justify-between transition">
          <div class="h-28 w-full bg-trans-grid rounded-xl flex items-center justify-center p-2 relative">
            <img src="${item.rawUrl}" class="max-h-full max-w-full object-contain filter drop-shadow">
          </div>
          <div class="mt-2">
            <b class="text-xs text-slate-800 truncate block">${item.displayName}</b>
            <span class="text-[10px] font-mono text-slate-400 truncate block">${item.fileName}</span>
            <button onclick="navigator.clipboard.writeText('${item.localPath}'); alert('Đã chép: ${item.localPath}')" class="mt-2 w-full py-1 bg-slate-100 hover:bg-emerald-50 text-[10px] font-bold rounded-lg text-slate-600 transition">
              Sao chép đường dẫn
            </button>
          </div>
        </div>
      `).join('');
    }

    function saveAndApplyToGame() {
      state.gameConfig.bgGlobal = document.getElementById('cfg-bg-global').value.trim();
      state.gameConfig.bgA = document.getElementById('cfg-bg-a').value.trim();
      state.gameConfig.bgB = document.getElementById('cfg-bg-b').value.trim();
      state.gameConfig.unlockTier2 = document.getElementById('cfg-unlock-tier2').checked;

      [1, 2, 3, 4].forEach(i => {
        state.gameConfig.buttons[`btn${i}`] = {
          label: document.getElementById(`cfg-btn${i}-label`).value.trim(),
          icon: document.getElementById(`cfg-btn${i}-icon`).value.trim(),
          action: document.getElementById(`cfg-btn${i}-act`).value
        };
      });

      localStorage.setItem('garden_shared_config_v2', JSON.stringify(state.gameConfig));
      alert('ĐÃ LƯU THÀNH CÔNG!\nCả 3 loại nền và 4 nút chức năng đã được cập nhật sang index.html.');
    }

    window.addEventListener('DOMContentLoaded', () => {
      const user = sessionStorage.getItem('current_admin_user');
      if (user === 'admin298') {
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('admin-app').classList.remove('hidden');
        initAdmin();
      }
    });
  </script>
</body>
</html>
