<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Thông Tin Lớp 11TA3 - 2026-2027</title>
    <!-- Thư viện Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary: #1d3557;
            --accent: #457b9d;
            --bg-gradient: linear-gradient(135deg, #0b090a 0%, #161a1d 40%, #1d3557 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1d3557;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        #bgCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: var(--bg-gradient);
        }

        header {
            padding: 8px 15px;
            background: rgba(13, 27, 42, 0.9);
            backdrop-filter: blur(12px);
            color: white;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.15rem;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 0.8px;
            background: linear-gradient(to right, #90e0ef, #48cae4, #ade8f4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        header .gvcn {
            font-size: 0.75rem;
            color: #caf0f8;
            font-style: italic;
            margin-top: 1px;
        }

        #dynamicBannerContainer {
            width: 100%;
            height: 80px;
            background: #000;
            overflow: hidden;
            position: relative;
            border-radius: 8px;
            margin-bottom: 8px;
            display: none;
            flex-shrink: 0;
        }
        #dynamicBannerContainer img {
            width: 100%; height: 100%;
            object-fit: cover;
            position: absolute;
            transition: opacity 1s ease-in-out;
            opacity: 0;
        }
        #dynamicBannerContainer img.active { opacity: 1; }

        .main-container {
            display: grid;
            grid-template-columns: 22% 78%;
            flex: 1;
            overflow: hidden;
            padding: 10px;
            gap: 10px;
        }

        .sidebar-a {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            overflow-y: auto;
        }

        .sidebar-a h3 {
            font-size: 0.82rem;
            color: var(--primary);
            border-bottom: 2px solid #a8dadc;
            padding-bottom: 3px;
            margin-bottom: 2px;
        }

        .menu-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .menu-btn:hover {
            background: #1d3557;
            transform: translateX(2px);
        }

        .sub-menu {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-left: 8px;
            border-left: 3px solid #457b9d;
            margin: 2px 0;
        }

        .content-b {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-item {
            background: white;
            padding: 10px 12px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border-left: 4px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-info h4 {
            color: var(--primary);
            font-size: 0.88rem;
            margin-bottom: 2px;
        }

        .card-info span {
            font-size: 0.72rem;
            color: #6c757d;
        }

        .btn-del {
            background: #e63946;
            color: white;
            padding: 5px 8px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
        }
        .btn-del:hover { background: #d90429; }

        .btn-edit {
            background: #f4a261;
            color: white;
            padding: 5px 8px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
            margin-right: 5px;
        }
        .btn-edit:hover { background: #e76f51; }

        .btn-restore {
            background: #2a9d8f;
            color: white;
            padding: 5px 8px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-bottom: 6px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.75rem;
        }

        .form-group input, .form-group select {
            padding: 5px 7px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 0.82rem;
        }

        .editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            background: #e9ecef;
            padding: 3px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            border: 1px solid #ced4da;
            border-bottom: none;
        }
        .editor-toolbar button {
            background: white;
            border: 1px solid #ced4da;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
            color: var(--primary);
        }
        .editor-toolbar button:hover { background: #dee2e6; }

        .rich-editor {
            min-height: 80px;
            max-height: 140px;
            overflow-y: auto;
            border: 1px solid #ced4da;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            padding: 6px;
            background: white;
            font-size: 0.82rem;
            outline: none;
        }
        .rich-editor img {
            display: block;
            margin: 0 auto;
            max-width: 100%;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input {
            width: 100%;
            padding-right: 35px;
        }
        .toggle-password {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            color: #6c757d;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scene-3d {
            width: 100%;
            height: 280px;
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 8px 0;
        }
        .card-3d {
            width: 100%;
            max-width: 450px;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            background: #fff;
        }
        .card-3d.flip { transform: rotateY(180deg); }
        .card-face {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background: #fff;
        }
        .card-face img {
            max-width: 100%;
            max-height: 220px;
            object-fit: contain;
            border-radius: 6px;
            cursor: pointer;
        }
        .card-back { transform: rotateY(180deg); }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 16px;
            border-radius: 10px;
            width: 420px;
            max-width: 90%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 85vh;
            overflow-y: auto;
        }

        #zoomModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: grab;
        }
        #zoomModal:active { cursor: grabbing; }
        #zoomedImg {
            transition: transform 0.1s ease-out;
            max-width: 90vw;
            max-height: 90vh;
            user-select: none;
            pointer-events: none;
        }
        .zoom-controls {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 8px;
            z-index: 3100;
        }
        .zoom-btn {
            background: rgba(255,255,255,0.8);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .zoom-btn:hover { background: white; }

        .pagination-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-download {
            background: #2a9d8f;
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.82rem;
            display: inline-block;
            margin-top: 8px;
        }
        .btn-download:hover { background: #21867a; }

        @media screen and (max-width: 768px) {
            body {
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }
            .main-container {
                display: flex;
                flex-direction: column;
                height: auto;
                overflow: visible;
            }
            .sidebar-a {
                max-height: 220px;
                flex-shrink: 0;
            }
            .content-b {
                min-height: 450px;
                flex-shrink: 0;
            }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <header>
        <h1>Trang thông tin của lớp 11TA3<br><span style="font-size: 0.85rem;">Niên khóa 2026-2027</span></h1>
        <div class="gvcn">GVCN: Trung Hiếu (Mr.Z)</div>
    </header>

    <div class="main-container">
        <div class="sidebar-a" id="sidebarA"></div>
        <div class="content-b">
            <div id="dynamicBannerContainer"></div>
            <div class="content-scroll" id="contentB"></div>
        </div>
    </div>

    <!-- POPUP TÌM KIẾM -->
    <div class="modal" id="searchModal">
        <div class="modal-content">
            <h3 style="font-size: 0.95rem; color:var(--primary);">🔍 Tìm Kiếm Thông Báo</h3>
            <div class="form-group">
                <label>Tên người đăng:</label>
                <input type="text" id="sAuthor" placeholder="Nhập tên người đăng...">
            </div>
            <div class="form-group">
                <label>STT thông báo:</label>
                <input type="number" id="sId" placeholder="Nhập số thứ tự...">
            </div>
            <div class="form-group">
                <label>Ngày đăng:</label>
                <input type="date" id="sDate">
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="menu-btn" style="flex:1; justify-content:center;" onclick="executeSearch()">Tìm kiếm</button>
                <button class="menu-btn" style="flex:1; justify-content:center; background:#6c757d;" onclick="closeSearchModal()">Đóng</button>
            </div>
            <div id="searchResults" style="margin-top: 4px; max-height: 140px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- POPUP ZOOM & PAN ẢNH -->
    <div id="zoomModal" onclick="closeZoomModal(event)">
        <img id="zoomedImg" src="" alt="Zoom Image">
        <div class="zoom-controls" onclick="event.stopPropagation()">
            <button class="zoom-btn" onclick="zoomIn()">➕ Phóng to</button>
            <button class="zoom-btn" onclick="zoomOut()">➖ Thu nhỏ</button>
            <button class="zoom-btn" onclick="resetZoom()">🔄 Đặt lại</button>
            <button class="zoom-btn" style="background:#e63946; color:white;" onclick="closeZoomModal()">❌ Đóng</button>
        </div>
    </div>
