<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Thông Tin Lớp 11TA3 - 2026-2027</title>
    <!-- Firebase SDK v10.8.0 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #1d3557;
            --accent: #457b9d;
            --bg-gradient: linear-gradient(135deg, #0b090a 0%, #161a1d 40%, #1d3557 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1d3557;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            position: fixed;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
        }

        #bgCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: var(--bg-gradient);
        }

        /* PHẦN C (HEADER) CỐ ĐỊNH */
        header {
            padding: 8px 15px;
            background: rgba(13, 27, 42, 0.96);
            backdrop-filter: blur(12px);
            color: white;
            border-bottom: 2px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.15rem;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 0.8px;
            background: linear-gradient(to right, #90e0ef, #48cae4, #ade8f4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            line-height: 1.35;
            padding-top: 2px;
        }

        header .gvcn {
            font-size: 0.75rem;
            color: #caf0f8;
            font-style: italic;
            margin-top: 2px;
        }

        #dynamicBannerContainer {
            width: 100%;
            height: 75px;
            background: #000;
            overflow: hidden;
            position: relative;
            border-radius: 8px;
            margin-bottom: 8px;
            display: none;
            flex-shrink: 0;
        }
        #dynamicBannerContainer img {
            width: 100%; height: 100%;
            object-fit: cover;
            position: absolute;
            transition: opacity 1s ease-in-out;
            opacity: 0;
        }
        #dynamicBannerContainer img.active { opacity: 1; }

        .main-container {
            display: grid;
            grid-template-columns: 24% 76%;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            padding: 8px 10px 10px 10px;
            gap: 10px;
        }

        .sidebar-a {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            min-height: 0;
            height: 100%;
        }

        .sidebar-a h3 {
            font-size: 0.82rem;
            color: var(--primary);
            border-bottom: 2px solid #a8dadc;
            padding-bottom: 3px;
            margin-bottom: 2px;
        }

        .menu-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .menu-btn:hover {
            background: #1d3557;
            transform: translateX(2px);
        }

        .sub-menu {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-left: 8px;
            border-left: 3px solid #457b9d;
            margin: 2px 0;
        }

        .content-b {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
            height: 100%;
        }

        .content-scroll {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-right: 4px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }

        .card-item {
            background: white;
            padding: 10px 12px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border-left: 4px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-info h4 {
            color: var(--primary);
            font-size: 0.88rem;
            margin-bottom: 2px;
        }

        .card-info span {
            font-size: 0.72rem;
            color: #6c757d;
        }

        .btn-del {
            background: #e63946;
            color: white;
            padding: 5px 8px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
        }
        .btn-del:hover { background: #d90429; }

        .btn-edit {
            background: #f4a261;
            color: white;
            padding: 5px 8px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
            margin-right: 5px;
        }
        .btn-edit:hover { background: #e76f51; }

        .btn-restore {
            background: #2a9d8f;
            color: white;
            padding: 5px 8px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-bottom: 6px;
        }

        .form-group label { font-weight: 600; font-size: 0.75rem; }

        .form-group input, .form-group select, .form-group textarea {
            padding: 5px 7px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 0.82rem;
            font-family: inherit;
        }

        .editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            background: #e9ecef;
            padding: 4px 6px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            border: 1px solid #ced4da;
            border-bottom: none;
        }
        .editor-toolbar button {
            background: white;
            border: 1px solid #ced4da;
            padding: 3px 7px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.78rem;
            color: var(--primary);
            transition: all 0.15s ease-in-out;
        }
        .editor-toolbar button:hover { background: #dee2e6; }
        .editor-toolbar button.active {
            background: var(--primary) !important;
            color: #ffffff !important;
            border-color: var(--primary) !important;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.25);
        }

        .color-picker-label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: white;
            border: 1px solid #ced4da;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: bold;
            color: var(--primary);
            user-select: none;
        }
        .color-picker-label:hover { background: #dee2e6; }
        .color-picker-label input[type="color"] {
            cursor: pointer;
            border: none;
            width: 18px;
            height: 18px;
            padding: 0;
            background: none;
            outline: none;
        }

        .rich-editor {
            min-height: 80px;
            max-height: 140px;
            overflow-y: auto;
            border: 1px solid #ced4da;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            padding: 6px;
            background: white;
            font-size: 0.82rem;
            outline: none;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input { width: 100%; padding-right: 35px; }
        .toggle-password {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            color: #6c757d;
            padding: 0;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 16px;
            border-radius: 10px;
            width: 420px;
            max-width: 90%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 85vh;
            overflow-y: auto;
        }

        #zoomModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
        }
        #zoomModal:active { cursor: grabbing; }
        #zoomedImg {
            transition: transform 0.05s linear;
            max-width: 90vw;
            max-height: 85vh;
            user-select: none;
            pointer-events: none;
            transform-origin: center center;
        }
        .zoom-controls {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 8px;
            z-index: 3100;
        }
        .zoom-btn {
            background: rgba(255,255,255,0.85);
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.82rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .zoom-btn:hover { background: white; }

        .pagination-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            padding-bottom: 6px;
        }

        .btn-download {
            background: #2a9d8f;
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.82rem;
            display: inline-block;
            margin-top: 4px;
        }
        .btn-download:hover { background: #21867a; }

        .doc-page-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            margin-top: 12px;
        }
        .doc-page-item {
            width: 100%;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .doc-page-img {
            width: 100%;
            max-width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 6px;
            cursor: pointer;
            display: block;
        }
        .doc-page-footer {
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 4px;
        }

        .pdf-viewer-container {
            width: 100%;
            margin-top: 14px;
            background: #fff;
            border: 1px solid #ced4da;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .pdf-iframe {
            width: 100%;
            height: 550px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
        }

        .welcome-card-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 20px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            animation: fadeIn 0.8s ease-in-out;
        }
        .welcome-greeting-text {
            font-family: 'Dancing Script', cursive;
            font-size: 2.85rem;
            line-height: 1.45;
            letter-spacing: 0.5px;
            margin: 0;
            padding: 0 15px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* RESPONSIVE DỌC: Phần A mở rộng vừa vặn hiển thị đầy đủ các nút */
        @media screen and (max-width: 768px) and (orientation: portrait) {
            header { padding: 6px 10px; min-height: 60px; }
            header h1 { font-size: 0.98rem; }
            header .gvcn { font-size: 0.7rem; }
            .main-container {
                display: flex;
                flex-direction: column;
                padding: 6px;
                gap: 6px;
                height: calc(100dvh - 60px);
                overflow: hidden;
            }
            .sidebar-a {
                max-height: 35%;
                flex-shrink: 0;
                overflow-y: auto;
                padding: 6px 8px;
                gap: 4px;
            }
            .sidebar-a .menu-btn { padding: 5px 8px; font-size: 0.78rem; gap: 5px; }
            .sidebar-a h3 { font-size: 0.78rem; margin-bottom: 1px; padding-bottom: 2px; }
            .content-b { flex: 1; min-height: 0; overflow: hidden; padding: 8px; }
            .pdf-iframe { height: 260px; }
            .welcome-greeting-text { font-size: 2.1rem; }
        }

        @media screen and (max-height: 520px) and (orientation: landscape) {
            header { padding: 4px 10px; min-height: 50px; }
            header h1 { font-size: 0.92rem; line-height: 1.2; }
            header .gvcn { font-size: 0.68rem; }
            .main-container {
                grid-template-columns: 32% 68%;
                padding: 5px;
                gap: 6px;
                height: calc(100dvh - 50px);
                overflow: hidden;
            }
            .sidebar-a { height: 100%; max-height: 100%; overflow-y: auto; padding: 6px; gap: 4px; }
            .menu-btn { padding: 5px 8px; font-size: 0.75rem; }
            .content-b { height: 100%; max-height: 100%; overflow: hidden; padding: 8px; }
            .content-scroll { padding-right: 3px; }
            .pdf-iframe { height: 220px; }
            .welcome-greeting-text { font-size: 1.85rem; }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <header>
        <h1>Trang thông tin của lớp 11TA3<br><span style="font-size: 0.85rem;">Niên khóa 2026-2027</span></h1>
        <div class="gvcn">GVCN: Trung Hiếu (Mr.Z)</div>
    </header>

    <div class="main-container">
        <div class="sidebar-a" id="sidebarA"></div>
        <div class="content-b">
            <div id="dynamicBannerContainer"></div>
            <div class="content-scroll" id="contentB"></div>
        </div>
    </div>

    <!-- POPUP TÌM KIẾM -->
    <div class="modal" id="searchModal">
        <div class="modal-content">
            <h3 style="font-size: 0.95rem; color:var(--primary);">🔍 Tìm Kiếm Thông Báo</h3>
            <div class="form-group">
                <label>Tên người đăng:</label>
                <input type="text" id="sAuthor" placeholder="Nhập tên người đăng...">
            </div>
            <div class="form-group">
                <label>STT thông báo:</label>
                <input type="number" id="sId" placeholder="Nhập số thứ tự...">
            </div>
            <div class="form-group">
                <label>Ngày đăng:</label>
                <input type="date" id="sDate">
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="menu-btn" style="flex:1; justify-content:center;" onclick="executeSearch()">Tìm kiếm</button>
                <button class="menu-btn" style="flex:1; justify-content:center; background:#6c757d;" onclick="closeSearchModal()">Đóng</button>
            </div>
            <div id="searchResults" style="margin-top: 4px; max-height: 140px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- POPUP ZOOM ẢNH -->
    <div id="zoomModal" onclick="closeZoomModal(event)">
        <img id="zoomedImg" src="" alt="Zoom Image">
        <div class="zoom-controls" onclick="event.stopPropagation()">
            <button class="zoom-btn" onclick="zoomIn()">➕ Phóng to</button>
            <button class="zoom-btn" onclick="zoomOut()">➖ Thu nhỏ</button>
            <button class="zoom-btn" onclick="resetZoom()">🔄 Đặt lại</button>
            <button class="zoom-btn" style="background:#e63946; color:white;" onclick="closeZoomModal()">❌ Đóng</button>
        </div>
    </div>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.keyCode === 123 || e.key === 'F12') e.preventDefault();
            if (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) e.preventDefault();
            if (e.ctrlKey && ['u','U','s','S'].includes(e.key)) e.preventDefault();
        });

        const firebaseConfig = {
            apiKey: "AIzaSyATUD-ddUU2Dg-3vpB9K8dO1W0FzK7ZIFI",
            authDomain: "ta3nh2627.firebaseapp.com",
            projectId: "ta3nh2627",
            storageBucket: "ta3nh2627.firebasestorage.app",
            messagingSenderId: "276398143272",
            appId: "1:276398143272:web:a32d4c9fe908c5ca4c821d",
            measurementId: "G-6D1FFK998C"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resizeCanvas;
        resizeCanvas();
        for (let i = 0; i < 30; i++) {
            particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: Math.random() * 2 + 1, speedX: (Math.random() - 0.5) * 0.3, speedY: (Math.random() - 0.5) * 0.3 });
        }
        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
            particles.forEach(p => {
                p.x += p.speedX; p.y += p.speedY;
                if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
            });
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        let notifications = [];
        let homeworks = [];
        let albums = [];
        let banners = [];
        let formsList = []; 
        let subAccounts = [];
        let trashBin = [];
        let scheduleUrl = "";

        let currentUser = null;
        let currentView = 'home';
        let notiPageOffset = 0;
        let homeworkPageOffset = 0;
        let albumIndex = 0;
        let editingNotiId = null;
        let editingAlbumId = null;
        
        let currentMultiLinks = []; 
        let currentHwMultiLinks = [];
        let currentAlbumLinks = []; 
        let currentBannerLinks = []; 

        let tempPostTitle = "";
        let tempPostContent = "";
        let tempPostPdf = "";
        let tempHwContent = "";
        let tempHwPdf = "";
        let tempAlbumTitle = "";

        let menuState = {
            adminAccSub: false,
            adminNotiSub: false,
            adminMediaSub: false
        };

        let lastCreatedAccountInfo = "Chưa có thông tin tài khoản được tạo...";

        function parseGoogleDriveLink(url) {
            if (!url) return "";
            url = url.trim();
            if (url.startsWith('data:')) return url;
            let match = url.match(/(?:\/d\/|id=)([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            return url;
        }

        function parseGoogleDrivePdfEmbed(url) {
            if (!url) return "";
            url = url.trim();
            let match = url.match(/(?:\/d\/|id=)([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://drive.google.com/file/d/${match[1]}/preview`;
            }
            return url;
        }

        function parseGoogleDrivePdfDownload(url) {
            if (!url) return "";
            url = url.trim();
            let match = url.match(/(?:\/d\/|id=)([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://drive.google.com/uc?export=download&id=${match[1]}`;
            }
            return url;
        }

        // --- CƠ CHẾ KẾT NỐI REALTIME CHUẨN XÁC VỚI FIRESTORE ---
        function initRealtimeDatabase() {
            // 1. Thông báo
            db.collection("notifications").onSnapshot(snapshot => {
                notifications = [];
                snapshot.forEach(doc => notifications.push({ ...doc.data(), docId: doc.id }));
                renderApp();
            }, err => console.log("Lỗi notifications:", err));

            // 2. Báo bài
            db.collection("homeworks").onSnapshot(snapshot => {
                homeworks = [];
                snapshot.forEach(doc => homeworks.push({ ...doc.data(), docId: doc.id }));
                renderApp();
            }, err => console.log("Lỗi homeworks:", err));

            // 3. Góc kỷ niệm
            db.collection("albums").onSnapshot(snapshot => {
                albums = [];
                snapshot.forEach(doc => {
                    let d = doc.data();
                    if (d.title !== "Album banner") {
                        albums.push({ ...d, docId: doc.id });
                    }
                });
                renderApp();
            }, err => console.log("Lỗi albums:", err));

            // 4. Thùng rác
            db.collection("trashBin").onSnapshot(snapshot => {
                trashBin = [];
                snapshot.forEach(doc => trashBin.push({ ...doc.data(), docId: doc.id }));
                renderApp();
            }, err => console.log("Lỗi trashBin:", err));

            // 5. Tài khoản
            db.collection("subAccounts").onSnapshot(snapshot => {
                subAccounts = [];
                snapshot.forEach(doc => subAccounts.push({ ...doc.data(), docId: doc.id }));
                let hasAdmin = subAccounts.find(a => a.name === "admin");
                if (!hasAdmin) {

        function saveSettingsToFirebase() {

            if (input.files && input.files.length > 0) {

        async function submitNewForm() {
            let title = document.getElementById('formTitleInput').value.trim();
            let url = document.getElementById('formUrlInput').value.trim();
            if (!title || !url) { alert("Vui lòng nhập tên biểu mẫu và đường dẫn URL!"); return; }

            let parsedUrl = parseGoogleDriveLink(url);
            let maxId = (formsList && formsList.length > 0) ? Math.max(...formsList.map(f => f.id || 0)) : 0;
            let newFormObj = {
                id: maxId + 1,
                title: title,
                url: parsedUrl,
                author: currentUser.name
            };

            try {
                if (!Array.isArray(formsList)) formsList = [];
                formsList.unshift(newFormObj);
                saveSettingsToFirebase(); // Lưu trực tiếp vào settings/general
                alert("Đăng biểu mẫu thành công!");
                switchView('admin_forms');
            } catch (err) {
                alert("Lỗi khi lưu biểu mẫu: " + err.message);
            }
        }

        function deleteFormItem(id) {
            if (confirm("Bạn có chắc chắn muốn xóa biểu mẫu này?")) {
                formsList = formsList.filter(f => f.id !== id);
                saveSettingsToFirebase();
                renderAdminFormsList();
            }
        }

            let container = document.getElementById('adminFormsListContainer');

                container.innerHTML = '<p style="color:#6c757d; font-size:0.8rem;">Chưa có biểu mẫu nào.</p>';
                return;
            }
            formsList.forEach(form => {
                container.innerHTML += `
                    <div class="card-item" style="padding:6px 10px;">
                        <div class="card-info" style="flex:1;">
                            <h4 style="font-size:0.82rem;">📄 ${form.title}</h4>

        /* ZOOM & PAN */
        let currentScale = 1, panX = 0, panY = 0, isDragging = false, startX = 0, startY = 0, initialDistance = 0, initialScale = 1;

        function openZoomModal(imgSrc) {
            let modal = document.getElementById('zoomModal');
            let img = document.getElementById('zoomedImg');
            img.src = parseGoogleDriveLink(imgSrc);
            resetZoom();
            modal.style.display = 'flex';
        }

        function closeZoomModal() { document.getElementById('zoomModal').style.display = 'none'; }
        function zoomIn() { currentScale = Math.min(currentScale + 0.4, 5); updateImageTransform(); }
        function zoomOut() { currentScale = Math.max(currentScale - 0.4, 0.6); updateImageTransform(); }
        function resetZoom() { currentScale = 1; panX = 0; panY = 0; updateImageTransform(); }

        function updateImageTransform() {
            let img = document.getElementById('zoomedImg');
            if (img) img.style.transform = `translate(${panX}px, ${panY}px) scale(${currentScale})`;
        }

        const zoomModalEl = document.getElementById('zoomModal');
        zoomModalEl.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX - panX; startY = e.clientY - panY; });
        window.addEventListener('mousemove', (e) => { if (!isDragging) return; panX = e.clientX - startX; panY = e.clientY - startY; updateImageTransform(); });
        window.addEventListener('mouseup', () => { isDragging = false; });
        zoomModalEl.addEventListener('wheel', (e) => { e.preventDefault(); if (e.deltaY < 0) zoomIn(); else zoomOut(); }, { passive: false });

        zoomModalEl.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true; startX = e.touches[0].clientX - panX; startY = e.touches[0].clientY - panY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                initialDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                initialScale = currentScale;
            }
        }, { passive: false });

        zoomModalEl.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && isDragging) {
                panX = e.touches[0].clientX - startX; panY = e.touches[0].clientY - startY; updateImageTransform();
            } else if (e.touches.length === 2) {
                let dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                if (initialDistance > 0) {
                    currentScale = Math.min(Math.max(initialScale * (dist / initialDistance), 0.6), 5);
                    updateImageTransform();
                }
            }
        }, { passive: false });

        zoomModalEl.addEventListener('touchend', (e) => {
            if (e.touches.length === 0) isDragging = false;
            else if (e.touches.length === 1) { isDragging = true; startX = e.touches[0].clientX - panX; startY = e.touches[0].clientY - panY; }
        });

                lastCreatedAccountInfo = `Tài khoản: ${accName} | Mật khẩu: ${generatedPass}`;
                let infoBox = document.getElementById('resAccountInfo');
                if (infoBox) infoBox.value = lastCreatedAccountInfo;
                alert("Tạo/cập nhật tài khoản thành công!");
            } catch (err) {
                alert("Lỗi khi lưu tài khoản: " + err.message);
            }
        }

        function copyAccountInfo() {
            let infoBox = document.getElementById('resAccountInfo');
            if (!infoBox || infoBox.value.includes("Chưa có")) return;
            navigator.clipboard.writeText(infoBox.value).then(() => alert("Đã copy thông tin tài khoản!"));
        }

        function toggleFormat(btn, cmd) {
            document.execCommand(cmd, false, null);
            btn.classList.toggle('active');
        }

        function toggleAlign(btn, cmd) {
            let toolbar = btn.closest('.editor-toolbar');
            let alignBtns = toolbar.querySelectorAll('button[data-align]');
            let wasActive = btn.classList.contains('active');
            alignBtns.forEach(b => b.classList.remove('active'));
            if (!wasActive) {
                document.execCommand(cmd, false, null);
                btn.classList.add('active');
            } else {
                document.execCommand('justifyLeft', false, null);
            }
        }

        function changeTextColor(color) { document.execCommand('foreColor', false, color); }

        function getCalculatedHomeworkTitle() {
            let targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + 1);
            let dayOfWeek = targetDate.getDay();
            if (dayOfWeek === 6) targetDate.setDate(targetDate.getDate() + 2);
            else if (dayOfWeek === 0) targetDate.setDate(targetDate.getDate() + 1);

            let daysMap = ["Chủ Nhật", "Hai", "Ba", "Tư", "Năm", "Sáu", "Bảy"];
            let dName = daysMap[targetDate.getDay()];
            let dayNum = String(targetDate.getDate()).padStart(2, '0');
            let monthNum = String(targetDate.getMonth() + 1).padStart(2, '0');
            let yearNum = targetDate.getFullYear();
            return `BÁO BÀI thứ ${dName} ngày ${dayNum}/${monthNum}/${yearNum}`;
        }

        initRealtimeDatabase();
    </script>
</body>
</html>
