<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Thông Tin Lớp 11TA3 - 2026-2027</title>
    <!-- Thư viện Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary: #1d3557;
            --accent: #457b9d;
            --bg-gradient: linear-gradient(135deg, #0b090a 0%, #161a1d 40%, #1d3557 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1d3557;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        #bgCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: var(--bg-gradient);
        }

        header {
            padding: 8px 15px;
            background: rgba(13, 27, 42, 0.9);
            backdrop-filter: blur(12px);
            color: white;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.15rem;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 0.8px;
            background: linear-gradient(to right, #90e0ef, #48cae4, #ade8f4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        header .gvcn {
            font-size: 0.75rem;
            color: #caf0f8;
            font-style: italic;
            margin-top: 1px;
        }

        #dynamicBannerContainer {
            width: 100%;
            height: 80px;
            background: #000;
            overflow: hidden;
            position: relative;
            border-radius: 8px;
            margin-bottom: 8px;
            display: none;
            flex-shrink: 0;
        }
        #dynamicBannerContainer img {
            width: 100%; height: 100%;
            object-fit: cover;
            position: absolute;
            transition: opacity 1s ease-in-out;
            opacity: 0;
        }
        #dynamicBannerContainer img.active { opacity: 1; }

        .main-container {
            display: grid;
            grid-template-columns: 22% 78%;
            flex: 1;
            overflow: hidden;
            padding: 10px;
            gap: 10px;
        }

        .sidebar-a {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            overflow-y: auto;
        }

        .sidebar-a h3 {
            font-size: 0.82rem;
            color: var(--primary);
            border-bottom: 2px solid #a8dadc;
            padding-bottom: 3px;
            margin-bottom: 2px;
        }

        .menu-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .menu-btn:hover {
            background: #1d3557;
            transform: translateX(2px);
        }

        .sub-menu {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-left: 8px;
            border-left: 3px solid #457b9d;
            margin: 2px 0;
        }

        .content-b {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-item {
            background: white;
            padding: 10px 12px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border-left: 4px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-info h4 {
            color: var(--primary);
            font-size: 0.88rem;
            margin-bottom: 2px;
        }

        .card-info span {
            font-size: 0.72rem;
            color: #6c757d;
        }

        .btn-del {
            background: #e63946;
            color: white;
            padding: 5px 8px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
        }
        .btn-del:hover { background: #d90429; }

        .btn-edit {
            background: #f4a261;
            color: white;
            padding: 5px 8px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
            margin-right: 5px;
        }
        .btn-edit:hover { background: #e76f51; }

        .btn-restore {
            background: #2a9d8f;
            color: white;
            padding: 5px 8px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-bottom: 6px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.75rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            padding: 5px 7px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 0.82rem;
            font-family: inherit;
        }

        .editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            background: #e9ecef;
            padding: 3px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            border: 1px solid #ced4da;
            border-bottom: none;
        }
        .editor-toolbar button {
            background: white;
            border: 1px solid #ced4da;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
            color: var(--primary);
        }
        .editor-toolbar button:hover { background: #dee2e6; }

        .rich-editor {
            min-height: 80px;
            max-height: 140px;
            overflow-y: auto;
            border: 1px solid #ced4da;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            padding: 6px;
            background: white;
            font-size: 0.82rem;
            outline: none;
        }
        .rich-editor img {
            display: block;
            margin: 0 auto;
            max-width: 100%;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input {
            width: 100%;
            padding-right: 35px;
        }
        .toggle-password {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            color: #6c757d;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 16px;
            border-radius: 10px;
            width: 420px;
            max-width: 90%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 85vh;
            overflow-y: auto;
        }

        #zoomModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: grab;
        }
        #zoomModal:active { cursor: grabbing; }
        #zoomedImg {
            transition: transform 0.1s ease-out;
            max-width: 90vw;
            max-height: 90vh;
            user-select: none;
            pointer-events: none;
        }
        .zoom-controls {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 8px;
            z-index: 3100;
        }
        .zoom-btn {
            background: rgba(255,255,255,0.8);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .zoom-btn:hover { background: white; }

        .pagination-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-download {
            background: #2a9d8f;
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.82rem;
            display: inline-block;
            margin-top: 8px;
        }
        .btn-download:hover { background: #21867a; }

        @media screen and (max-width: 768px) {
            body {
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }
            .main-container {
                display: flex;
                flex-direction: column;
                height: auto;
                overflow: visible;
            }
            .sidebar-a {
                max-height: 220px;
                flex-shrink: 0;
            }
            .content-b {
                min-height: 450px;
                flex-shrink: 0;
            }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <header>
        <h1>Trang thông tin của lớp 11TA3<br><span style="font-size: 0.85rem;">Niên khóa 2026-2027</span></h1>
        <div class="gvcn">GVCN: Trung Hiếu (Mr.Z)</div>
    </header>

    <div class="main-container">
        <div class="sidebar-a" id="sidebarA"></div>
        <div class="content-b">
            <div id="dynamicBannerContainer"></div>
            <div class="content-scroll" id="contentB"></div>
        </div>
    </div>

    <!-- POPUP TÌM KIẾM -->
    <div class="modal" id="searchModal">
        <div class="modal-content">
            <h3 style="font-size: 0.95rem; color:var(--primary);">🔍 Tìm Kiếm Thông Báo</h3>
            <div class="form-group">
                <label>Tên người đăng:</label>
                <input type="text" id="sAuthor" placeholder="Nhập tên người đăng...">
            </div>
            <div class="form-group">
                <label>STT thông báo:</label>
                <input type="number" id="sId" placeholder="Nhập số thứ tự...">
            </div>
            <div class="form-group">
                <label>Ngày đăng:</label>
                <input type="date" id="sDate">
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="menu-btn" style="flex:1; justify-content:center;" onclick="executeSearch()">Tìm kiếm</button>
                <button class="menu-btn" style="flex:1; justify-content:center; background:#6c757d;" onclick="closeSearchModal()">Đóng</button>
            </div>
            <div id="searchResults" style="margin-top: 4px; max-height: 140px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- POPUP ZOOM & PAN ẢNH -->
    <div id="zoomModal" onclick="closeZoomModal(event)">
        <img id="zoomedImg" src="" alt="Zoom Image">
        <div class="zoom-controls" onclick="event.stopPropagation()">
            <button class="zoom-btn" onclick="zoomIn()">➕ Phóng to</button>
            <button class="zoom-btn" onclick="zoomOut()">➖ Thu nhỏ</button>
            <button class="zoom-btn" onclick="resetZoom()">🔄 Đặt lại</button>
            <button class="zoom-btn" style="background:#e63946; color:white;" onclick="closeZoomModal()">❌ Đóng</button>
        </div>
    </div>

    <script>
        // --- CHẶN PHÍM F12 VÀ CHUỘT PHẢI ---
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.keyCode === 123 || e.key === 'F12') e.preventDefault();
            if (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) e.preventDefault();
            if (e.ctrlKey && ['u','U','s','S'].includes(e.key)) e.preventDefault();
        });

        const firebaseConfig = {
            apiKey: "AIzaSyATUD-ddUU2Dg-3vpB9K8dO1W0FzK7ZIFI",
            authDomain: "ta3nh2627.firebaseapp.com",
            projectId: "ta3nh2627",
            storageBucket: "ta3nh2627.firebasestorage.app",
            messagingSenderId: "276398143272",
            appId: "1:276398143272:web:a32d4c9fe908c5ca4c821d",
            measurementId: "G-6D1FFK998C"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resizeCanvas;
        resizeCanvas();
        for (let i = 0; i < 30; i++) {
            particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: Math.random() * 2 + 1, speedX: (Math.random() - 0.5) * 0.3, speedY: (Math.random() - 0.5) * 0.3 });
        }
        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
            particles.forEach(p => {
                p.x += p.speedX; p.y += p.speedY;
                if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
            });
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        let notifications = [];
        let homeworks = [];
        let albums = [];
        let banners = [];
        let subAccounts = [];
        let trashBin = [];
        let scheduleUrl = "";

        let currentUser = null;
        let currentView = 'home';
        let notiPageOffset = 0;
        let homeworkPageOffset = 0;
        let albumIndex = 0;
        let editingNotiId = null;

        let menuState = {
            adminAccSub: false,
            adminNotiSub: false
        };

        let lastCreatedAccountInfo = "Chưa có thông tin tài khoản được tạo...";

        function parseGoogleDriveLink(url) {
            if (!url) return "";
            url = url.trim();
            // Nếu là dữ liệu base64 (tải từ máy) thì giữ nguyên
            if (url.startsWith('data:')) return url;

            let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            let matchId = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (matchId && matchId[1]) {
                return `https://lh3.googleusercontent.com/d/${matchId[1]}`;
            }
            return url;
        }

        function loadDataFromFirebase(callback) {
            db.collection("class_data").doc("main_store").get().then((doc) => {
                if (doc.exists) {
                    let data = doc.data();
                    notifications = data.notifications || [];
                    homeworks = data.homeworks || [];
                    albums = data.albums || [];
                    banners = data.banners || [];
                    subAccounts = data.subAccounts || [];
                    trashBin = data.trashBin || [];
                    scheduleUrl = data.scheduleUrl || "";

                    // TÍNH NĂNG TỰ ĐỘNG XÓA DỮ LIỆU SAU 7 NGÀY (NẾU CÓ THỜI GIAN HẠN)
                    let now = Date.now();
                    let sevenDaysMs = 7 * 24 * 60 * 60 * 1000;
                    let hasExpired = false;

                    notifications.forEach(n => {
                        if (n.isTemporary && n.timestamp && (now - n.timestamp > sevenDaysMs)) {
                            n.mediaUrl = ""; // Xóa ảnh sau 7 ngày
                            hasExpired = false; // Có thể lưu lại nếu cần
                        }
                    });
                } else {
                    notifications = [{ id: 1, title: "Kế hoạch năm học mới", content: "Chào mừng các em đến với năm học 2026-2027.", timestamp: Date.now() - 3600000, date: "2026-09-01 08:00", author: "GVCN", mediaUrl: "", mediaType: "" }];
                    homeworks = [];
                    albums = [];
                    banners = [];
                    subAccounts = [{ name: "admin", pass: "ad1234", studentName: "Quản Trị Viên Phụ", isAdmin: true }];
                    scheduleUrl = "";
                    saveDataToFirebase();
                }
                let hasAdminSub = subAccounts.find(acc => acc.name === "admin");
                if (!hasAdminSub) {
                    subAccounts.push({ name: "admin", pass: "ad1234", studentName: "Quản Trị Viên Phụ", isAdmin: true });
                }

                if (callback) callback();
                renderApp();
            }).catch((error) => {
                console.error("Lỗi tải dữ liệu từ Firebase: ", error);
            });
        }

        function saveDataToFirebase() {
            db.collection("class_data").doc("main_store").set({
                notifications, homeworks, albums, banners, subAccounts, trashBin, scheduleUrl
            }).then(() => {
                renderApp();
            }).catch((error) => {
                console.error("Lỗi lưu dữ liệu lên Firebase: ", error);
            });
        }

        function renderApp() {
            renderSidebarA();
            renderContentB();
            renderBannerSlideshow();
        }

        function renderSidebarA() {
            let html = '';
            if (!currentUser) {
                html = `
                    <button class="menu-btn" onclick="switchView('login')" style="background:#1d3557; margin-bottom: 2px;">🔑 Đăng nhập</button>
                    <h3>Khám Phá</h3>
                    <button class="menu-btn" onclick="switchView('noti_list')">📢 Xem thông báo</button>
                    <button class="menu-btn" onclick="switchView('homework_list')">📚 Xem báo bài</button>
                    <button class="menu-btn" onclick="switchView('schedule_view')">📅 Xem TKB</button>
                    <button class="menu-btn" onclick="switchView('album_list')">🖼️ Góc kỷ niệm</button>
                `;
            } else if (currentUser.role === 'admin') {
                let accSubDisplay = menuState.adminAccSub ? 'flex' : 'none';
                let notiSubDisplay = menuState.adminNotiSub ? 'flex' : 'none';

                html = `
                    <div style="font-size:0.75rem; padding:4px; background:#e0fbfc; border-radius:5px; font-weight:bold; color:#1d3557;">👑 ${currentUser.name}</div>
                    <button class="menu-btn" onclick="switchView('admin_post')">✍️ Đăng thông báo mới</button>
                    <button class="menu-btn" onclick="switchView('admin_homework')">📖 Đăng báo bài mới</button>
                    <button class="menu-btn" onclick="switchView('admin_schedule')">📅 Đăng TKB</button>
                    <button class="menu-btn" onclick="switchView('admin_album')">📷 Đăng ảnh/clip kỷ niệm</button>
                    <button class="menu-btn" onclick="switchView('admin_banner')">✨ Quản lý ảnh banner</button>
                    
                    <button class="menu-btn" onclick="toggleSubMenu('adminAccSub')">👥 Quản lý tài khoản</button>
                    <div id="adminAccSub" class="sub-menu" style="display:${accSubDisplay};">
                        <button class="menu-btn" style="background:#457b9d; font-size:0.75rem;" onclick="switchView('admin_create_acc')">➕ Tạo tài khoản/pass mới</button>
                        <button class="menu-btn" style="background:#457b9d; font-size:0.75rem;" onclick="switchView('admin_del_acc')">🗑️ Danh sách tài khoản</button>
                    </div>

                    <button class="menu-btn" onclick="toggleSubMenu('adminNotiSub')">📋 Quản lý thông báo</button>
                    <div id="adminNotiSub" class="sub-menu" style="display:${notiSubDisplay};">
                        <button class="menu-btn" style="background:#457b9d; font-size:0.75rem;" onclick="switchView('admin_manage_noti')">📜 Danh sách bài đăng</button>
                        <button class="menu-btn" style="background:#457b9d; font-size:0.75rem;" onclick="switchView('trash_noti')">📁 Thông báo đã xóa</button>
                    </div>

                    <button class="menu-btn" onclick="logout()" style="background:#e63946; margin-top:4px;">🚪 Đăng xuất</button>
                `;
            } else {
                html = `
                    <div style="font-size:0.75rem; padding:4px; background:#e0fbfc; border-radius:5px; font-weight:bold; color:#1d3557;">👤 ${currentUser.name}</div>
                    <button class="menu-btn" onclick="switchView('sub_post')">✍️ Đăng thông báo mới</button>
                    <button class="menu-btn" onclick="switchView('admin_homework')">📖 Đăng báo bài mới</button>
                    <button class="menu-btn" onclick="switchView('admin_schedule')">📅 Đăng TKB</button>
                    <button class="menu-btn" onclick="switchView('sub_album')">📷 Đăng ảnh/clip kỷ niệm</button>
                    <button class="menu-btn" onclick="switchView('sub_manage_noti')">📋 Quản lý bài đăng</button>
                    <button class="menu-btn" onclick="logout()" style="background:#e63946; margin-top:4px;">🚪 Đăng xuất</button>
                `;
            }
            document.getElementById('sidebarA').innerHTML = html;
        }

        function toggleSubMenu(id) {
            if (id === 'adminAccSub') {
                menuState.adminAccSub = !menuState.adminAccSub;
                menuState.adminNotiSub = false;
            } else if (id === 'adminNotiSub') {
                menuState.adminNotiSub = !menuState.adminNotiSub;
                menuState.adminAccSub = false;
            }
            renderSidebarA();
        }

        function switchView(view) {
            if (view !== 'admin_create_acc' && view !== 'admin_del_acc' && view !== 'admin_manage_noti' && view !== 'trash_noti') {
                menuState.adminAccSub = false;
                menuState.adminNotiSub = false;
            }
            currentView = view;
            notiPageOffset = 0;
            homeworkPageOffset = 0;
            editingNotiId = null;
            renderApp();
        }

        function renderContentB() {
            let b = document.getElementById('contentB');
            b.innerHTML = '';

            if (currentView === 'home' || currentView === 'noti_list') {
                let sorted = [...notifications].sort((a,b) => b.id - a.id);

        function saveOrUpdateAccount() {
            let studentName = document.getElementById('newStudentName').value.trim();
            let accName = document.getElementById('newAccName').value.trim();

            if (!studentName && !accName) {
                alert("Vui lòng nhập Họ tên tài khoản đầy đủ hoặc Tên tài khoản!");
                return;
            }

            if (!accName && studentName) {
                let parts = studentName.split(" ");
                accName = parts[parts.length - 1].toLowerCase();
            }

            let initials = "";
            if (studentName) {
                let words = studentName.split(" ");
                words.forEach(w => { if(w.length > 0) initials += w.charAt(0).toLowerCase(); });
            } else {
                initials = accName.charAt(0).toLowerCase();
            }
            let randomNum = Math.floor(1000 + Math.random() * 9000);
            let generatedPass = initials + randomNum;

            if (accName.toLowerCase() === 'admin') {
                let adminAcc = subAccounts.find(acc => acc.name === 'admin');
                if (adminAcc) {
                    adminAcc.pass = generatedPass;
                    if(studentName) adminAcc.studentName = studentName;
                } else {
                    subAccounts.push({ name: 'admin', pass: generatedPass, studentName: studentName || 'Quản Trị Viên Phụ', isAdmin: true });
                }
                alert("Đã cập nhật mật khẩu mới cho tài khoản admin thành công!");
            } else {
                let existingIndex = subAccounts.findIndex(acc => acc.name.toLowerCase() === accName.toLowerCase());

                if (existingIndex !== -1) {
                    subAccounts[existingIndex].pass = generatedPass;
                    subAccounts[existingIndex].studentName = studentName || subAccounts[existingIndex].studentName;
                    alert("Đã cập nhật (ghi đè) mật khẩu mới thành công!");
                } else {
                    subAccounts.push({ name: accName, pass: generatedPass, studentName: studentName });
                    alert("Tạo tài khoản cán bộ lớp thành công!");
                }
            }

            saveDataToFirebase();

            lastCreatedAccountInfo = `Tài khoản: ${accName} | Mật khẩu: ${generatedPass}`;
            let infoBox = document.getElementById('resAccountInfo');
            if (infoBox) infoBox.value = lastCreatedAccountInfo;
        }

        function getCalculatedHomeworkTitle() {
            let targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + 1);
            let dayOfWeek = targetDate.getDay();

            if (dayOfWeek === 6) {
                targetDate.setDate(targetDate.getDate() + 2);
            } else if (dayOfWeek === 0) {
                targetDate.setDate(targetDate.getDate() + 1);
            }

            let daysMap = ["Chủ Nhật", "Hai", "Ba", "Tư", "Năm", "Sáu", "Bảy"];
            let dName = daysMap[targetDate.getDay()];
            let dayNum = String(targetDate.getDate()).padStart(2, '0');
            let monthNum = String(targetDate.getMonth() + 1).padStart(2, '0');
            let yearNum = targetDate.getFullYear();

            return `BÁO BÀI thứ ${dName} ngày ${dayNum}/${monthNum}/${yearNum}`;
        }

        function submitHomework() {
            let title = document.getElementById('hwTitle').value.trim();
            let content = document.getElementById('hwContent').innerHTML.trim();
            let fileInput = document.getElementById('hwMediaFile');
            let linkInput = document.getElementById('hwMediaLink').value.trim();

            if (!content || content === "<br>") {
                alert("Vui lòng nhập nội dung báo bài!");
                return;
            }

            let processHwSave = (mediaUrl) => {
                if (mediaUrl) {
                    let urls = mediaUrl.split('\n').filter(u => u.trim().length > 0);
                    urls.forEach(u => {
                        let parsedU = parseGoogleDriveLink(u);
                        content += `<br><img src="${parsedU}" style="display:block; margin:4px auto; max-width:100%;">`;
                    });
                }

                let maxId = homeworks.length > 0 ? Math.max(...homeworks.map(h => h.id)) : 0;
                let newId = maxId + 1;
                let now = new Date();
                let dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

                homeworks.push({
                    id: newId,
                    title: title,
                    content: content,
                    timestamp: Date.now(),
                    date: dateStr,
                    author: currentUser.name
                });

                saveDataToFirebase();
                alert("Đăng báo bài thành công!");
                switchView('homework_list');
            };

            if (linkInput) {
                processHwSave(parseGoogleDriveLink(linkInput));
            } else if (fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = (e) => {
                    processHwSave(e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                processHwSave("");
            }
        }

                    imgs[currentIdx].classList.add('active');
                }, 6000);
            }
        }

        function submitNotification() {
            let title = document.getElementById('postTitle').value.trim();
            let content = document.getElementById('postContent').innerHTML.trim();
            let fileInput = document.getElementById('postMediaFile');
            let linkInput = document.getElementById('postMediaLink').value.trim();

            if (!title || !content || content === "<br>") { alert("Vui lòng nhập tiêu đề và nội dung!"); return; }

            let processSave = (mediaUrl, mediaType) => {
                if (editingNotiId !== null) {
                    let item = notifications.find(n => n.id === editingNotiId);
                    if (item) {
                        item.title = title;
                        item.content = content;
                        if (mediaUrl) {
                            item.mediaUrl = mediaUrl;
                            item.mediaType = mediaType;
                        }
                    }
                    alert("Đã cập nhật thông báo!");
                } else {
                    let maxId = notifications.length > 0 ? Math.max(...notifications.map(n => n.id)) : 0;
                    let newId = maxId + 1;
                    let now = new Date();
                    let dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

                    notifications.push({
                        id: newId, title, content, timestamp: Date.now(), date: dateStr,
                        author: currentUser.name, mediaUrl: mediaUrl || "", mediaType: mediaType || "", isTemporary: fileInput.files && fileInput.files.length > 0
                    });
                    alert("Đăng thông báo thành công!");
                }

                saveDataToFirebase();
                editingNotiId = null;
                switchView(currentUser.role === 'admin' ? 'admin_manage_noti' : 'sub_manage_noti');
            };

            if (linkInput) {
                processSave(linkInput, 'image');
            } else if (fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = (e) => {
                    processSave(e.target.result, 'image');
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                let existingMediaUrl = "";
                let existingMediaType = "";
                if (editingNotiId !== null) {
                    let oldItem = notifications.find(n => n.id === editingNotiId);
                    if (oldItem) { existingMediaUrl = oldItem.mediaUrl; existingMediaType = oldItem.mediaType; }
                }
                processSave(existingMediaUrl, existingMediaType);
            }
        }

        function deleteNotification(id) {
            let idx = notifications.findIndex(n => n.id === id);
            if (idx !== -1) {
                let noti = notifications.splice(idx, 1)[0];
                trashBin.push({ ...noti, deletedBy: currentUser.name, deletedAt: new Date().toLocaleString() });
                saveDataToFirebase();
            }
        }

        function restoreNotification(idx) {
            let item = trashBin.splice(idx, 1)[0];
            delete item.deletedBy; delete item.deletedAt;
            notifications.push(item);
            saveDataToFirebase();
        }

        function deleteSelectedTrash() {
            let checkboxes = document.querySelectorAll('.trash-check:checked');
            if (checkboxes.length === 0) { alert("Chọn ít nhất một mục!"); return; }
            if (confirm("Xóa vĩnh viễn các mục đã chọn?")) {
                let indices = Array.from(checkboxes).map(cb => parseInt(cb.dataset.idx)).sort((a,b) => b-a);
                indices.forEach(i => trashBin.splice(i, 1));
                saveDataToFirebase();
            }
        }

        let currentScale = 1;
        let panX = 0, panY = 0;
        let isDragging = false;
        let startX = 0, startY = 0;

        function openZoomModal(imgSrc) {
            let modal = document.getElementById('zoomModal');
            let img = document.getElementById('zoomedImg');
            img.src = parseGoogleDriveLink(imgSrc);
            currentScale = 1; panX = 0; panY = 0;
            updateImageTransform();
            modal.style.display = 'flex';
        }

        function closeZoomModal() { document.getElementById('zoomModal').style.display = 'none'; }
        function zoomIn() { currentScale = Math.min(currentScale + 0.3, 4); updateImageTransform(); }
        function zoomOut() { currentScale = Math.max(currentScale - 0.3, 0.5); updateImageTransform(); }
        function resetZoom() { currentScale = 1; panX = 0; panY = 0; updateImageTransform(); }
        function updateImageTransform() {
            let img = document.getElementById('zoomedImg');
            img.style.transform = `translate(${panX}px, ${panY}px) scale(${currentScale})`;
        }

        const zoomModalEl = document.getElementById('zoomModal');
        zoomModalEl.addEventListener('mousedown', (e) => {
            isDragging = true; startX = e.clientX - panX; startY = e.clientY - panY;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX; panY = e.clientY - startY;
            updateImageTransform();
        });
        window.addEventListener('mouseup', () => { isDragging = false; });
        zoomModalEl.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY < 0) zoomIn(); else zoomOut();
        }, { passive: false });

        function openSearchModal() { document.getElementById('searchModal').style.display = 'flex'; }
        function closeSearchModal() { document.getElementById('searchModal').style.display = 'none'; }

        function executeSearch() {
            let aName = document.getElementById('sAuthor').value.toLowerCase().trim();
            let sId = document.getElementById('sId').value.trim();
            let sDate = document.getElementById('sDate').value.trim();

            let res = notifications.filter(n => {
                let matchA = aName ? n.author.toLowerCase().includes(aName) : true;
                let matchId = sId ? n.id.toString() === sId : true;
                let matchDate = sDate ? n.date.startsWith(sDate) : true;
                return matchA && matchId && matchDate;
            });

            let box = document.getElementById('searchResults');
            box.innerHTML = '';
            if (res.length === 0) {
                box.innerHTML = '<p style="color:#6c757d; font-size:0.75rem; margin-top:3px;">Không tìm thấy thông báo phù hợp.</p>';
            } else {
                res.forEach(item => {
                    box.innerHTML += `
                        <div class="card-item" style="margin-top:5px; padding:5px; cursor:pointer;" onclick="closeSearchModal(); showFullDetail(${item.id})">
                            <div class="card-info">
                                <h4 style="font-size:0.78rem;">Số ${item.id}: ${item.title}</h4>
                                <span style="font-size:0.65rem;">${item.date} - ${item.author}</span>
                            </div>
                        </div>
                    `;
                });
            }
        }

        loadDataFromFirebase();
    </script>
</body>
</html>
